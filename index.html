<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CT Viewer & Anatomical Glossary (349 Terms)</title>
    <!-- JSZip for fast .zip extraction -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <!-- Tesseract.js for OCR scanning text inside screenshot images -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* Night Theme (Default) */
        :root, [data-theme="dark"] {
            --bg-dark: #0b0d10;
            --viewport-bg: radial-gradient(circle at center, #13161c 0%, #07080a 100%);
            --panel-bg: #161920;
            --panel-border: #262b36;
            --card-bg: #11141a;
            --card-border: #222734;
            --card-hover: #3b4459;
            --input-bg: #0d0f14;
            --input-border: #2e3545;
            --btn-bg: #222733;
            --btn-border: #333a4b;
            --btn-hover: #2d3444;
            --control-bg: #1c2029;
            --overlay-bg: rgba(22, 25, 32, 0.84);
            --overlay-border: #334155;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --badge-bg: rgba(56, 189, 248, 0.14);
            --badge-border: rgba(56, 189, 248, 0.4);
            --badge-text: #7dd3fc;
        }

        /* Day Theme */
        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --viewport-bg: radial-gradient(circle at center, #e2e8f0 0%, #cbd5e1 100%);
            --panel-bg: #ffffff;
            --panel-border: #cbd5e1;
            --card-bg: #f8fafc;
            --card-border: #e2e8f0;
            --card-hover: #94a3b8;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --btn-bg: #f1f5f9;
            --btn-border: #cbd5e1;
            --btn-hover: #e2e8f0;
            --control-bg: #f8fafc;
            --overlay-bg: rgba(255, 255, 255, 0.9);
            --overlay-border: #94a3b8;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #64748b;
            --badge-bg: rgba(2, 132, 199, 0.12);
            --badge-border: rgba(2, 132, 199, 0.35);
            --badge-text: #0369a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Top Toolbar */
        .toolbar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 30;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .title {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            color: var(--accent);
            margin-right: 4px;
            white-space: nowrap;
        }

        .plane-tabs, .lang-switch {
            display: inline-flex;
            background: var(--input-bg);
            padding: 3px;
            border-radius: 7px;
            border: 1px solid var(--panel-border);
        }

        .plane-tab, .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lang-btn {
            padding: 4px 7px;
            font-size: 11px;
        }

        .plane-tab:hover, .lang-btn:hover {
            color: var(--text-main);
        }

        .plane-tab.active, .lang-btn.active {
            background: var(--accent);
            color: #ffffff;
        }

        [data-theme="dark"] .plane-tab.active,
        [data-theme="dark"] .lang-btn.active {
            color: #000000;
        }

        .plane-count {
            font-size: 10.5px;
            opacity: 0.85;
            font-weight: 500;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent);
        }

        .btn-primary {
            background-color: #0369a1;
            color: #ffffff;
            border-color: #0284c7;
        }

        .btn-primary:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            font-weight: 600;
        }

        [data-theme="dark"] .btn.active {
            color: #000000;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--control-bg);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
        }

        .control-item input[type="range"] {
            width: 65px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--viewport-bg);
            cursor: grab;
            touch-action: none;
        }

        .viewport.dragging {
            cursor: grabbing;
        }

        /* Clean Welcome Overlay */
        .drop-overlay {
            position: absolute;
            inset: 16px;
            border: 2px dashed var(--overlay-border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background-color: var(--overlay-bg);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .drop-overlay.dragover {
            border-color: var(--accent);
        }

        .drop-overlay.hidden {
            display: none;
        }

        .drop-icon {
            font-size: 46px;
            margin-bottom: 12px;
        }

        .drop-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        .drop-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #sliceImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            will-change: transform, filter;
            pointer-events: none;
            display: none;
        }

        /* Glossary Sidebar */
        .sidebar {
            width: 400px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 25;
        }

        .sidebar.collapsed {
            display: none;
        }

        .sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 6px;
            position: relative;
        }

        .search-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px 30px 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .clear-search {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            display: none;
            padding: 4px;
        }

        .sidebar-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-pills {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .pill-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .pill-btn.active {
            background: var(--badge-bg);
            color: var(--accent);
            border-color: var(--accent);
        }

        .ocr-status {
            font-size: 11.5px;
            color: #d97706;
            display: none;
            padding: 6px 8px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 5px;
            line-height: 1.4;
        }

        [data-theme="dark"] .ocr-status {
            color: #fbbf24;
        }

        .glossary-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .term-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px 10px;
            transition: border-color 0.12s;
            user-select: text;
            -webkit-user-select: text;
        }

        .term-card:hover {
            border-color: var(--card-hover);
        }

        .term-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 3px;
        }

        .term-lat {
            font-weight: 600;
            font-size: 13px;
            color: var(--accent);
        }

        .pin-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-muted);
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .pin-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .term-est {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .term-rus {
            font-size: 12px;
            color: var(--text-muted);
        }

        .term-links {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 6px;
        }

        .slice-badge {
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--badge-text);
            font-size: 11.5px;
            font-family: monospace;
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .slice-badge:hover {
            background: var(--accent);
            color: #ffffff;
        }

        [data-theme="dark"] .slice-badge:hover {
            color: #000000;
        }

        .slice-badge .del-link {
            font-weight: bold;
            opacity: 0.7;
            padding-left: 3px;
        }

        .slice-badge .del-link:hover {
            opacity: 1;
        }

        /* Bottom Bar */
        .bottom-bar {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
        }

        .slice-counter {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            min-width: 115px;
            color: var(--accent);
            white-space: nowrap;
        }

        #sliceSlider {
            flex: 1;
            accent-color: var(--accent);
            height: 8px;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }

        /* Mobile & Tablet Responsive Optimization */
        @media (max-width: 820px) {
            .toolbar {
                padding: 6px 8px;
                gap: 6px;
            }

            .control-item.desktop-only {
                display: none;
            }

            .sidebar {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 68%;
                border-left: none;
                border-top: 2px solid var(--accent);
                border-radius: 14px 14px 0 0;
                box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.5);
            }

            .bottom-bar {
                padding: 10px 10px;
                gap: 8px;
            }

            #sliceSlider {
                height: 12px;
            }

            .slice-counter {
                min-width: 90px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="toolbar-group">
            <div class="title">CT Viewer</div>

            <div class="plane-tabs">
                <button class="plane-tab active" data-plane="axial">
                    <span id="tab-label-axial">Axial</span> <span class="plane-count" id="count-axial">(0)</span>
                </button>
                <button class="plane-tab" data-plane="coronal">
                    <span id="tab-label-coronal">Coronal</span> <span class="plane-count" id="count-coronal">(0)</span>
                </button>
                <button class="plane-tab" data-plane="sagittal">
                    <span id="tab-label-sagittal">Sagittal</span> <span class="plane-count" id="count-sagittal">(0)</span>
                </button>
            </div>

            <!-- Single Unified Upload Button -->
            <label class="btn btn-primary" for="unifiedInput" id="loadBtnToolbar">
                📁 Load Screenshots or Folder
            </label>
            <input type="file" id="unifiedInput" multiple>
        </div>

        <div class="toolbar-group">
            <div class="control-item">
                <span>🔍 <b id="zoomLabel">100%</b></span>
                <button class="btn" id="zoomOutBtn" style="padding: 1px 7px;">−</button>
                <button class="btn" id="zoomInBtn" style="padding: 1px 7px;">+</button>
            </div>

            <div class="control-item desktop-only">
                <span>☀️</span>
                <input type="range" id="brightnessRange" min="30" max="250" value="100">
            </div>

            <div class="control-item desktop-only">
                <span>◐</span>
                <input type="range" id="contrastRange" min="30" max="250" value="100">
            </div>

            <button class="btn" id="invertBtn">Invert</button>
            <button class="btn" id="resetBtn">Reset</button>
            <button class="btn" id="themeToggleBtn">☀️ Day</button>

            <!-- Interface Language Switcher (EN / ET / RU) -->
            <div class="lang-switch" title="Interface Language">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="et">ET</button>
                <button class="lang-btn" data-lang="ru">RU</button>
            </div>

            <button class="btn active" id="toggleGlossaryBtn">📖 Glossary</button>
        </div>
    </div>

    <div class="workspace">
        <div class="viewport" id="viewport">
            <img id="sliceImage" alt="CT Slice">

            <!-- Clean Single-Option Welcome Overlay -->
            <div class="drop-overlay" id="dropOverlay">
                <div class="drop-icon">🩻</div>
                <div class="drop-title" id="dropTitle">Load Screenshots or Folder</div>
                <div class="drop-actions">
                    <label class="btn btn-primary" for="unifiedInput" id="loadBtnOverlay" style="font-size: 14px; padding: 10px 20px;">
                        📁 Load Screenshots or Folder
                    </label>
                </div>
            </div>
        </div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search Latin, Eesti, Русский or #slice...">
                    <button class="clear-search" id="clearSearchBtn">✕</button>
                </div>
                <div class="sidebar-meta">
                    <span id="termCountLabel">349 terms</span>
                    <div class="filter-pills">
                        <button class="pill-btn active" id="filterAllBtn">All</button>
                        <button class="pill-btn" id="filterPinnedBtn">Pinned</button>
                        <button class="pill-btn" id="ocrScanBtn">🔍 Auto-Scan (OCR)</button>
                        <button class="pill-btn" id="exportLinksBtn">Export</button>
                        <button class="pill-btn" id="importLinksBtn">Import</button>
                        <input type="file" id="importLinksInput" accept=".json">
                    </div>
                </div>
                <div class="ocr-status" id="ocrStatus"></div>
            </div>
            <div class="glossary-list" id="glossaryList"></div>
        </aside>
    </div>

    <!-- Bottom Slice Navigation Bar -->
    <div class="bottom-bar">
        <button class="btn" id="prevBtn">◀</button>
        <button class="btn" id="playBtn">▶ Play</button>
        <button class="btn" id="nextBtn">▶</button>
        <div class="slice-counter" id="sliceCounter">Slice: 0 / 0</div>
        <input type="range" id="sliceSlider" min="0" max="0" value="0" disabled>
    </div>

        function switchPlane(planeName, renderSlice = true) {
            if (!planes[planeName]) return;
            activePlane = planeName;

            document.querySelectorAll('.plane-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.plane === activePlane);

        function updatePlaneCounts() {
            PLANE_ORDER.forEach(p => {
                document.getElementById(`count-${p}`).textContent = `(${planes[p].images.length})`;

        function isImageFilename(name) {
            return /\.(png|jpe?g|bmp|webp|gif|tiff?|avif|svg)$/i.test(name);
        }

        function isZipFilename(name) {
            return /\.zip$/i.test(name);
        }

        function isOtherArchiveFilename(name) {
            return /\.(7z|rar|tar|gz|tgz|bz2|xz)$/i.test(name);
        }

        function detectPlaneFromPath(pathStr) {
            const p = pathStr.toLowerCase();
            if (/\b(axial|ax)\b/.test(p) || p.includes('axial') || p.includes('_ax_')) return 'axial';
            if (/\b(coronal|cor)\b/.test(p) || p.includes('coronal') || p.includes('_cor_')) return 'coronal';
            if (/\b(sagittal|sag)\b/.test(p) || p.includes('sagittal') || p.includes('_sag_')) return 'sagittal';
            return null;
        }

        function setPlaneFiles(planeName, itemArray) {
            const st = planes[planeName];
            st.images.forEach(item => URL.revokeObjectURL(item.url));

            itemArray.sort((a, b) =>
                a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })
            );

            st.images = itemArray.map(item => {
                const url = URL.createObjectURL(item.blob);
                const preload = new Image();
                preload.decoding = 'async';
                preload.src = url;
                return {
                    name: item.name,
                    url: url,
                    preloadRef: preload,
                    ocrText: ''
                };
            });

            st.index = 0;
        }

        // Dynamic loader for libarchive.js (.7z, .rar, .tar, .gz, .bz2, .xz, .zip)
        let libarchiveReadyPromise = null;
        async function getLibArchive() {
            if (!libarchiveReadyPromise) {
                libarchiveReadyPromise = (async () => {
                    const mod = await import('https://cdn.jsdelivr.net/npm/libarchive.js@2.0.2/main.js');
                    const workerResp = await fetch('https://cdn.jsdelivr.net/npm/libarchive.js@2.0.2/dist/worker-bundle.js');
                    const workerCode = await workerResp.text();
                    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
                    const workerUrl = URL.createObjectURL(workerBlob);
                    mod.Archive.init({ workerUrl });
                    return mod.Archive;
                })();
            }
            return libarchiveReadyPromise;
        }

        async function collectLibArchiveEntries(obj, currentPath, outList) {
            for (const key of Object.keys(obj)) {
                const val = obj[key];
                const fullPath = currentPath ? `${currentPath}/${key}` : key;
                if (val && typeof val.extract === 'function') {
                    if (!fullPath.includes('__MACOSX') && isImageFilename(key)) {
                        const extractedFile = await val.extract();
                        outList.push({
                            name: key,
                            fullPath: fullPath,
                            blob: extractedFile
                        });
                    }
                } else if (val && typeof val === 'object') {
                    await collectLibArchiveEntries(val, fullPath, outList);
                }
            }
        }

        async function readDroppedEntries(dataTransferItems) {
            const filesWithPaths = [];

            async function traverseEntry(entry, pathPrefix) {
                if (!entry) return;
                if (entry.isFile) {
                    const file = await new Promise(res => entry.file(res, () => res(null)));
                    if (file) {
                        filesWithPaths.push({
                            file,
                            fullPath: pathPrefix ? `${pathPrefix}/${file.name}` : file.name
                        });
                    }
                } else if (entry.isDirectory) {
                    const reader = entry.createReader();
                    let batch = [];
                    do {
                        batch = await new Promise(res => reader.readEntries(res, () => res([])));
                        for (const child of batch) {
                            await traverseEntry(child, pathPrefix ? `${pathPrefix}/${entry.name}` : entry.name);
                        }
                    } while (batch.length > 0);
                }
            }

            const entries = [];
            for (let i = 0; i < dataTransferItems.length; i++) {
                const item = dataTransferItems[i];
                if (item.webkitGetAsEntry) {
                    const entry = item.webkitGetAsEntry();
                    if (entry) entries.push(entry);
                }
            }

            for (const entry of entries) {
                await traverseEntry(entry, '');
            }
            return filesWithPaths;
        }

        async function loadFiles(fileList, customPaths = null) {
            stopPlay();
            const extractedItems = [];
            const zipFiles = [];
            const otherArchives = [];

            const itemsToProcess = customPaths || Array.from(fileList).map(f => ({
                file: f,
                fullPath: (f.webkitRelativePath || '') + ' ' + f.name
            }));

            itemsToProcess.forEach(({ file, fullPath }) => {
                if (isZipFilename(file.name)) {
                    zipFiles.push(file);
                } else if (isOtherArchiveFilename(file.name)) {
                    otherArchives.push(file);
                } else if (file.type.startsWith('image/') || isImageFilename(file.name)) {
                    extractedItems.push({
                        name: file.name,
                        fullPath: fullPath,
                        blob: file
                    });
                }
            });

            if (zipFiles.length > 0 && typeof JSZip !== 'undefined') {
                dropOverlay.classList.remove('hidden');
                dropTitle.textContent = t('extractingZip');
                for (const zf of zipFiles) {
                    try {
                        const zip = await JSZip.loadAsync(zf);
                        const entries = [];
                        zip.forEach((relativePath, zipEntry) => {
                            if (!zipEntry.dir && !relativePath.includes('__MACOSX') && isImageFilename(zipEntry.name)) {
                                entries.push({ relativePath, zipEntry });
                            }
                        });
                        for (const entry of entries) {
                            const blob = await entry.zipEntry.async('blob');
                            const shortName = entry.relativePath.split('/').pop();
                            extractedItems.push({
                                name: shortName,
                                fullPath: entry.relativePath,
                                blob: blob
                            });
                        }
                    } catch (err) {
                        otherArchives.push(zf);
                    }
                }
            }

            if (otherArchives.length > 0) {
                dropOverlay.classList.remove('hidden');
                dropTitle.textContent = t('extractingArch');
                try {
                    const Archive = await getLibArchive();
                    for (const archFile of otherArchives) {
                        const archive = await Archive.open(archFile);
                        const filesObj = await archive.getFilesObject();
                        await collectLibArchiveEntries(filesObj, '', extractedItems);
                    }
                } catch (err) {
                    alert('Failed to unpack archive.');
                }
            }

            dropTitle.textContent = t('dropTitle');

            if (extractedItems.length === 0) {
                alert(t('alertNoValid'));
                return;
            }

            const buckets = { axial: [], coronal: [], sagittal: [], unknown: [] };
            extractedItems.forEach(item => {
                const detected = detectPlaneFromPath(item.fullPath);
                if (detected) buckets[detected].push(item);
                else buckets.unknown.push(item);
            });

            const hasAutoDetected = buckets.axial.length > 0 || buckets.coronal.length > 0 || buckets.sagittal.length > 0;

            if (hasAutoDetected) {
                if (buckets.axial.length > 0) setPlaneFiles('axial', buckets.axial);
                if (buckets.coronal.length > 0) setPlaneFiles('coronal', buckets.coronal);
                if (buckets.sagittal.length > 0) setPlaneFiles('sagittal', buckets.sagittal);
                if (buckets.unknown.length > 0 && planes[activePlane].images.length === 0) {
                    setPlaneFiles(activePlane, buckets.unknown);
                }

                updatePlaneCounts();
                if (buckets[activePlane].length > 0) switchPlane(activePlane);
                else if (buckets.axial.length > 0) switchPlane('axial');
                else if (buckets.coronal.length > 0) switchPlane('coronal');
                else if (buckets.sagittal.length > 0) switchPlane('sagittal');
            } else {
                setPlaneFiles(activePlane, extractedItems);
                updatePlaneCounts();
                switchPlane(activePlane);
            }
        }

        function showSlice(index) {
            const st = planes[activePlane];
            if (st.images.length === 0) return;
            if (index < 0) index = 0;
            if (index >= st.images.length) index = st.images.length - 1;

            st.index = index;
            const current = st.images[st.index];
            sliceImage.src = current.url;
            sliceSlider.value = st.index;

            const textCount = `${st.index + 1} / ${st.images.length}`;
            sliceCounter.textContent = `${t('slice')}: ${textCount}`;
        }

        // Seamless Manual & Automatic Stepping Across Axial <-> Coronal <-> Sagittal (No Infinite Loop)
        function stepSlice(delta) {
            if (delta === 0) return false;
            const nonEmptyPlanes = PLANE_ORDER.filter(p => planes[p].images.length > 0);
            if (nonEmptyPlanes.length === 0) return false;

            if (planes[activePlane].images.length === 0) {
                switchPlane(nonEmptyPlanes[0]);
                showSlice(0);
                return true;
            }

            let targetPlane = activePlane;
            let targetIndex = planes[targetPlane].index + delta;

            // Step forward across plane boundaries (Axial -> Coronal -> Sagittal)
            while (targetIndex >= planes[targetPlane].images.length) {
                const curOrderIdx = nonEmptyPlanes.indexOf(targetPlane);
                if (curOrderIdx < nonEmptyPlanes.length - 1) {
                    targetIndex -= planes[targetPlane].images.length;
                    targetPlane = nonEmptyPlanes[curOrderIdx + 1];
                } else {
                    // Reached the very end of the last loaded plane
                    targetIndex = planes[targetPlane].images.length - 1;
                    if (targetPlane !== activePlane) switchPlane(targetPlane, false);
                    showSlice(targetIndex);
                    return false; // Indicates we hit the end boundary
                }
            }

            // Step backward across plane boundaries (Sagittal -> Coronal -> Axial)
            while (targetIndex < 0) {
                const curOrderIdx = nonEmptyPlanes.indexOf(targetPlane);
                if (curOrderIdx > 0) {
                    targetPlane = nonEmptyPlanes[curOrderIdx - 1];
                    targetIndex += planes[targetPlane].images.length;
                } else {
                    // Reached the very first slice of the first loaded plane
                    targetIndex = 0;
                    if (targetPlane !== activePlane) switchPlane(targetPlane, false);
                    showSlice(0);
                    return false;
                }
            }

            if (targetPlane !== activePlane) {
                switchPlane(targetPlane, false);
            }
            showSlice(targetIndex);
            return true;
        }

        function updateTransform() {
            const st = planes[activePlane];
            sliceImage.style.transform = `translate(${st.panX}px, ${st.panY}px) scale(${st.scale})`;
            zoomLabel.textContent = `${Math.round(st.scale * 100)}%`;
        }

        function updateFilters() {
            const inv = inverted ? 100 : 0;
            sliceImage.style.filter = `brightness(${brightness}%) contrast(${contrast}%) invert(${inv}%)`;
        }

        function resetView() {
            const st = planes[activePlane];

            brightness = 100;

            inverted = false;

        // --- Sequential Play Across Axial -> Coronal -> Sagittal (No Loop) ---
        function stopPlay() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            playBtn.textContent = t('play');
            playBtn.classList.remove('active');
        }

        function togglePlay() {
            if (playInterval) {
                stopPlay();
                return;
            }

            const nonEmptyPlanes = PLANE_ORDER.filter(p => planes[p].images.length > 0);
            if (nonEmptyPlanes.length === 0) return;

            const lastPlane = nonEmptyPlanes[nonEmptyPlanes.length - 1];
            const isAtVeryEnd =
                activePlane === lastPlane &&
                planes[lastPlane].index >= planes[lastPlane].images.length - 1;

            if (planes[activePlane].images.length === 0 || isAtVeryEnd) {
                switchPlane(nonEmptyPlanes[0], false);
                showSlice(0);
            }

            playBtn.textContent = t('pause');
            playBtn.classList.add('active');

            playInterval = setInterval(() => {
                const moved = stepSlice(1);
                if (!moved) {
                    stopPlay();
                }
            }, 120);
        }

        playBtn.addEventListener('click', togglePlay);

        function renderGlossary() {
            const query = searchInput.value.trim().toLowerCase();
            clearSearchBtn.style.display = query ? 'block' : 'none';

            const st = planes[activePlane];
            if (query && st.images.length > 0) {
                const numMatch = query.match(/^#?(\d+)$/);

                    }
                } else {
                    const fileIdx = st.images.findIndex(img =>
                        img.name.toLowerCase().includes(query) ||

                    );

                }
            }

            const fragment = document.createDocumentFragment();
            let visibleCount = 0;

            GLOSSARY_DATA.forEach(([lat, est, rus]) => {
                const links = termLinks[lat] || [];
                if (showOnlyPinned && links.length === 0) return;

                if (query) {

                    const matchEst = est.toLowerCase().includes(query);
                    const matchRus = rus.toLowerCase().includes(query);

                    if (!matchLat && !matchEst && !matchRus && !matchLink) return;
                }

                visibleCount++;
                const card = document.createElement('div');
                card.className = 'term-card';

                const topRow = document.createElement('div');
                topRow.className = 'term-top';

                const pinBtn = document.createElement('button');
                pinBtn.className = 'pin-btn';
                pinBtn.textContent = t('pinBtn');
                pinBtn.addEventListener('click', () => pinTermToCurrentSlice(lat));

                topRow.appendChild(latEl);
                topRow.appendChild(pinBtn);

                const estEl = document.createElement('div');
                estEl.className = 'term-est';
                estEl.textContent = `🇪🇪 ${est}`;

                if (links.length > 0) {
                    const linksRow = document.createElement('div');
                    linksRow.className = 'term-links';

                    links.forEach((lnk, idx) => {

                        badge.innerHTML = `<span>${shortPlane} #${lnk.slice}</span><span class="del-link">×</span>`;

                        badge.addEventListener('click', e => {
                            if (e.target.classList.contains('del-link')) {
                                removeTermLink(lat, idx);
                            } else {
                                stopPlay();
                                switchPlane(lnk.plane, false);
                                showSlice(lnk.slice - 1);
                                if (window.innerWidth <= 820) {
                                    sidebar.classList.add('collapsed');
                                    toggleGlossaryBtn.classList.remove('active');
                                }
                            }
                        });
                        linksRow.appendChild(badge);
                    });

                    card.appendChild(linksRow);
                }

                fragment.appendChild(card);
            });

            glossaryList.innerHTML = '';
            glossaryList.appendChild(fragment);
            termCountLabel.textContent = `${visibleCount} / ${GLOSSARY_DATA.length} ${t('termsUnit')}`;
        }

        function pinTermToCurrentSlice(lat) {
            const st = planes[activePlane];
            const sliceNum = st.images.length > 0 ? st.index + 1 : 1;
            if (!termLinks[lat]) termLinks[lat] = [];
            const exists = termLinks[lat].some(l => l.plane === activePlane && l.slice === sliceNum);
            if (!exists) {
                termLinks[lat].push({ plane: activePlane, slice: sliceNum });
                saveTermLinks();
                renderGlossary();
            }
        }

        function removeTermLink(lat, idx) {
            if (!termLinks[lat]) return;
            termLinks[lat].splice(idx, 1);
            if (termLinks[lat].length === 0) delete termLinks[lat];
            saveTermLinks();
            renderGlossary();
        }

        // --- High-Accuracy Multi-Threaded OCR Engine ---
        function normalizeText(str) {
            return (str || '')
                .toLowerCase()
                .replace(/ё/g, 'е')
                .replace(/[ōòóô]/g, 'õ')
                .replace(/[-–—/\\:;.,()[\]]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function skeletonText(str) {
            return normalizeText(str)
                .replace(/[0õö]/g, 'o')
                .replace(/[1l|]/g, 'i')
                .replace(/ä/g, 'a')
                .replace(/ü/g, 'u')
                .replace(/й/g, 'и');
        }

        function getTermCandidates(lat, est, rus) {
            const rawList = [];
            const addCand = s => {
                const n = normalizeText(s);
                if (n.length >= 3) rawList.push(n);
            };

            const latNoBrackets = lat.replace(/\[.*?\]/g, '').trim();
            addCand(latNoBrackets);

            if (latNoBrackets.includes(':') || latNoBrackets.includes(';')) {
                const subParts = latNoBrackets.split(/[:;]/).map(s => s.trim());
                subParts.slice(1).forEach(addCand);
            }

            addCand(est.split('(')[0]);
            const estParen = est.match(/\(([^)]+)\)/);
            if (estParen) addCand(estParen[1]);

            addCand(rus.split('(')[0]);
            const rusParen = rus.match(/\(([^)]+)\)/);
            if (rusParen) addCand(rusParen[1]);

            return rawList.map(cand => {
                const skelCand = skeletonText(cand);
                return {
                    cand,
                    skelCand,
                    isShort: cand.length <= 5,
                    candWords: skelCand.split(' ').filter(w => w.length >= 2)
                };
            });
        }

        const PRECOMPILED_GLOSSARY = GLOSSARY_DATA.map(([lat, est, rus]) => ({
            lat,
            candidates: getTermCandidates(lat, est, rus)
        }));

        function editDistance(a, b) {
            if (Math.abs(a.length - b.length) > 3) return 99;
            const dp = Array.from({ length: a.length + 1 }, (_, i) => i);
            for (let j = 1; j <= b.length; j++) {
                let prev = dp[0];
                dp[0] = j;
                for (let i = 1; i <= a.length; i++) {
                    const temp = dp[i];
                    dp[i] = a[i - 1] === b[j - 1]
                        ? prev
                        : 1 + Math.min(prev, dp[i], dp[i - 1]);
                    prev = temp;
                }
            }
            return dp[a.length];
        }

        function matchesSliceOCR(compiledCandidates, normSlice, skelSlice, skelWords) {
            const paddedNorm = ` ${normSlice} `;
            const paddedSkel = ` ${skelSlice} `;

            for (const { cand, skelCand, isShort, candWords } of compiledCandidates) {
                if (isShort) {
                    if (paddedNorm.includes(` ${cand} `) || paddedSkel.includes(` ${skelCand} `)) {
                        return true;
                    }
                    continue;
                }

                if (normSlice.includes(cand) || skelSlice.includes(skelCand)) {
                    return true;
                }

                if (candWords.length > 0 && skelWords.length >= candWords.length) {
                    for (let idx = 0; idx <= skelWords.length - candWords.length; idx++) {
                        let allWordsClose = true;
                        for (let w = 0; w < candWords.length; w++) {
                            const targetW = candWords[w];
                            const actualW = skelWords[idx + w];
                            const maxAllowedErrors = targetW.length >= 7 ? 2 : (targetW.length >= 5 ? 1 : 0);
                            if (editDistance(targetW, actualW) > maxAllowedErrors) {
                                allWordsClose = false;
                                break;
                            }
                        }
                        if (allWordsClose) return true;
                    }
                }
            }
            return false;
        }

        async function prepareHighResOCRBlob(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const scale = img.width < 1400 ? 1.5 : 1.0;
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => resolve(blob || url), 'image/png');
                };
                img.onerror = () => resolve(url);
                img.src = url;
            });
        }

        ocrScanBtn.addEventListener('click', async () => {
            if (isScanningOCR) {
                cancelOCRRequested = true;
                ocrStatus.textContent = '⏹ Stopping OCR...';
                return;
            }

            const jobs = [];
            PLANE_ORDER.forEach(planeName => {
                planes[planeName].images.forEach((imgObj, idx) => {
                    jobs.push({ planeName, imgObj, sliceNum: idx + 1 });
                });
            });

            if (jobs.length === 0) {
                alert(t('alertLoadFirst'));
                return;
            }
            if (typeof Tesseract === 'undefined') {
                alert('Tesseract OCR library requires an internet connection.');
                return;
            }

            isScanningOCR = true;
            cancelOCRRequested = false;
            ocrStatus.style.display = 'block';
            ocrScanBtn.classList.add('active');
            ocrScanBtn.textContent = t('ocrStop');
            let matchedTotal = 0;
            let completedSlices = 0;

            try {
                const numWorkers = Math.min(navigator.hardwareConcurrency || 4, 4);
                ocrStatus.textContent = `⚡ Starting ${numWorkers} OCR threads (${jobs.length} slices)...`;

                const scheduler = Tesseract.createScheduler();
                await Promise.all(Array.from({ length: numWorkers }, async () => {
                    const w = await Tesseract.createWorker(['eng', 'est', 'rus']);
                    await w.setParameters({ tessedit_pageseg_mode: '11' });
                    scheduler.addWorker(w);
                }));

                await Promise.all(jobs.map(async ({ planeName, imgObj, sliceNum }) => {
                    if (cancelOCRRequested) return;
                    const hiResBlob = await prepareHighResOCRBlob(imgObj.url);
                    if (cancelOCRRequested) return;

                    const ret = await scheduler.addJob('recognize', hiResBlob);
                    if (cancelOCRRequested) return;

                    let reconstructedLines = ret.data.text || '';
                    if (ret.data.lines && ret.data.lines.length > 1) {
                        const lines = ret.data.lines.slice().sort((a, b) => a.bbox.y0 - b.bbox.y0);
                        for (let a = 0; a < lines.length; a++) {
                            for (let b = a + 1; b < lines.length; b++) {
                                const dy = lines[b].bbox.y0 - lines[a].bbox.y1;
                                const dx = Math.abs(lines[b].bbox.x0 - lines[a].bbox.x0);
                                if (dy >= -8 && dy <= 36 && dx <= 140) {
                                    reconstructedLines += ' ' + lines[a].text + ' ' + lines[b].text;
                                }
                            }
                        }
                    }

                    const normSlice = normalizeText(reconstructedLines);
                    const skelSlice = skeletonText(reconstructedLines);
                    const skelWords = skelSlice.split(' ').filter(Boolean);
                    imgObj.ocrText = normSlice;

                    let foundNewOnSlice = false;
                    PRECOMPILED_GLOSSARY.forEach(({ lat, candidates }) => {
                        if (matchesSliceOCR(candidates, normSlice, skelSlice, skelWords)) {
                            if (!termLinks[lat]) termLinks[lat] = [];
                            if (!termLinks[lat].some(l => l.plane === planeName && l.slice === sliceNum)) {
                                termLinks[lat].push({ plane: planeName, slice: sliceNum });
                                matchedTotal++;
                                foundNewOnSlice = true;
                            }
                        }
                    });

                    completedSlices++;
                    ocrStatus.textContent = `🔍 OCR: ${completedSlices} / ${jobs.length} (${matchedTotal} links)...`;
                    if (foundNewOnSlice && completedSlices % 3 === 0) {
                        renderGlossary();
                    }
                }));

                await scheduler.terminate();
                saveTermLinks();
                renderGlossary();
                ocrStatus.textContent = cancelOCRRequested
                    ? `⏹ OCR stopped (${matchedTotal} links saved).`
                    : `✅ Complete! Linked ${matchedTotal} terms across ${jobs.length} slices.`;
            } catch (err) {
                ocrStatus.textContent = '⚠️ OCR interrupted.';
            } finally {
                isScanningOCR = false;
                cancelOCRRequested = false;
                ocrScanBtn.classList.remove('active');
                ocrScanBtn.textContent = t('ocrScan');
            }
        });

        // Glossary UI Listeners
        searchInput.addEventListener('input', renderGlossary);
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            renderGlossary();
            searchInput.focus();
        });

        filterAllBtn.addEventListener('click', () => {
            showOnlyPinned = false;
            filterAllBtn.classList.add('active');
            filterPinnedBtn.classList.remove('active');
            renderGlossary();
        });

        filterPinnedBtn.addEventListener('click', () => {
            showOnlyPinned = true;
            filterPinnedBtn.classList.add('active');
            filterAllBtn.classList.remove('active');
            renderGlossary();
        });

        toggleGlossaryBtn.addEventListener('click', () => {
            const collapsed = sidebar.classList.toggle('collapsed');
            toggleGlossaryBtn.classList.toggle('active', !collapsed);
        });

        exportLinksBtn.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(termLinks, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ct_glossary_slice_links.json';
            a.click();
        });

        importLinksBtn.addEventListener('click', () => importLinksInput.click());
        importLinksInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    termLinks = Object.assign({}, termLinks, data);
                    saveTermLinks();
                    renderGlossary();
                } catch (err) {
                    alert('Invalid JSON file.');
                }
            };
            reader.readAsText(file);
        });

        // Unified Input & Drag-and-Drop Listeners
        unifiedInput.addEventListener('change', e => {
            if (e.target.files && e.target.files.length > 0) {
                loadFiles(e.target.files);
                e.target.value = '';
            }
        });

        window.addEventListener('dragover', e => {
            e.preventDefault();
            dropOverlay.classList.remove('hidden');
            dropOverlay.classList.add('dragover');
        });

        window.addEventListener('dragleave', e => {
            if (e.relatedTarget === null) {
                dropOverlay.classList.remove('dragover');
                if (planes[activePlane].images.length > 0) dropOverlay.classList.add('hidden');
            }
        });

        window.addEventListener('drop', async e => {
            e.preventDefault();
            dropOverlay.classList.remove('dragover');

            if (e.dataTransfer.items && e.dataTransfer.items.length > 0 && e.dataTransfer.items[0].webkitGetAsEntry) {
                const customPaths = await readDroppedEntries(e.dataTransfer.items);
                if (customPaths.length > 0) {
                    await loadFiles(null, customPaths);
                    return;
                }
            }

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                await loadFiles(e.dataTransfer.files);
            } else if (planes[activePlane].images.length > 0) {
                dropOverlay.classList.add('hidden');
            }
        });

        // Desktop Mouse Wheel & Drag (Uses stepSlice for cross-plane transitions)
        viewport.addEventListener('wheel', e => {
            e.preventDefault();
            const st = planes[activePlane];
            if (st.images.length === 0) return;

            if (e.ctrlKey || e.metaKey) {
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
                const newScale = Math.min(Math.max(st.scale * zoomFactor, 0.5), 15);

                const rect = viewport.getBoundingClientRect();
                const cursorX = e.clientX - rect.left - rect.width / 2;
                const cursorY = e.clientY - rect.top - rect.height / 2;

                st.panX = cursorX - (cursorX - st.panX) * (newScale / st.scale);
                st.panY = cursorY - (cursorY - st.panY) * (newScale / st.scale);
                st.scale = newScale;

                updateTransform();
            } else {
                stopPlay();
                const step = e.deltaY > 0 ? 1 : -1;
                stepSlice(step);
            }
        }, { passive: false });

        viewport.addEventListener('mousedown', e => {
            if (e.button !== 0 && e.button !== 1) return;
            const st = planes[activePlane];
            if (st.images.length === 0) return;
            isDragging = true;
            startX = e.clientX - st.panX;
            startY = e.clientY - st.panY;
            viewport.classList.add('dragging');
        });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const st = planes[activePlane];
            st.panX = e.clientX - startX;
            st.panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            viewport.classList.remove('dragging');
        });

        // Mobile Touch Gestures (Uses incremental stepSlice for cross-plane swipe)
        let touchMode = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartPanX = 0;
        let touchStartPanY = 0;
        let lastSwipeStep = 0;
        let initialPinchDist = 0;
        let initialPinchScale = 1;
        let lastTapTime = 0;

        function getTouchDistance(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        viewport.addEventListener('touchstart', e => {
            const st = planes[activePlane];
            if (st.images.length === 0) return;

            if (e.touches.length === 1) {
                const now = Date.now();
                if (now - lastTapTime < 280) {
                    st.scale = st.scale > 1.2 ? 1 : 2.5;
                    if (st.scale === 1) { st.panX = 0; st.panY = 0; }
                    updateTransform();
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;

                touchMode = 'single';
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartPanX = st.panX;
                touchStartPanY = st.panY;
                lastSwipeStep = 0;
            } else if (e.touches.length === 2) {
                touchMode = 'pinch';
                initialPinchDist = getTouchDistance(e.touches[0], e.touches[1]);
                initialPinchScale = st.scale;
                touchStartX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                touchStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                touchStartPanX = st.panX;
                touchStartPanY = st.panY;
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', e => {
            const st = planes[activePlane];
            if (st.images.length === 0) return;
            e.preventDefault();

            if (touchMode === 'pinch' && e.touches.length === 2) {
                const dist = getTouchDistance(e.touches[0], e.touches[1]);
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

                st.scale = Math.min(Math.max(initialPinchScale * (dist / initialPinchDist), 0.5), 12);
                st.panX = touchStartPanX + (midX - touchStartX);
                st.panY = touchStartPanY + (midY - touchStartY);
                updateTransform();
            } else if (touchMode === 'single' && e.touches.length === 1) {
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;

                if (st.scale > 1.05 || Math.abs(st.panX) > 5 || Math.abs(st.panY) > 5) {
                    st.panX = touchStartPanX + dx;
                    st.panY = touchStartPanY + dy;
                    updateTransform();
                } else {
                    stopPlay();
                    const currentSwipeStep = Math.round(dy / 14);
                    const delta = currentSwipeStep - lastSwipeStep;
                    if (delta !== 0) {
                        stepSlice(delta);
                        lastSwipeStep = currentSwipeStep;
                    }
                }
            }
        }, { passive: false });

        viewport.addEventListener('touchend', () => {
            touchMode = null;
        });

        // Bottom & Toolbar Controls
        sliceSlider.addEventListener('input', e => {
            stopPlay();
            showSlice(parseInt(e.target.value, 10));
        });
        prevBtn.addEventListener('click', () => {
            stopPlay();
            stepSlice(-1);
        });
        nextBtn.addEventListener('click', () => {
            stopPlay();
            stepSlice(1);
        });

        zoomInBtn.addEventListener('click', () => {
            const st = planes[activePlane];
            st.scale = Math.min(st.scale * 1.25, 15);
            updateTransform();
        });

        zoomOutBtn.addEventListener('click', () => {
            const st = planes[activePlane];
            st.scale = Math.max(st.scale / 1.25, 0.5);
            updateTransform();
        });

        brightnessRange.addEventListener('input', e => {
            brightness = e.target.value;
            updateFilters();
        });

        contrastRange.addEventListener('input', e => {
            contrast = e.target.value;
            updateFilters();
        });

        invertBtn.addEventListener('click', () => {
            inverted = !inverted;
            invertBtn.classList.toggle('active', inverted);
            updateFilters();
        });

        resetBtn.addEventListener('click', resetView);

        window.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
                e.preventDefault();
                sidebar.classList.remove('collapsed');
                toggleGlossaryBtn.classList.add('active');
                searchInput.focus();
                searchInput.select();
                return;
            }

            if (document.activeElement === searchInput) {
                if (e.key === 'Escape') searchInput.blur();
                return;
            }

            if (e.key === '1') { stopPlay(); switchPlane('axial'); return; }
            if (e.key === '2') { stopPlay(); switchPlane('coronal'); return; }
            if (e.key === '3') { stopPlay(); switchPlane('sagittal'); return; }

            if (e.key === ' ') {
                e.preventDefault();
                togglePlay();
                return;
            }

            const st = planes[activePlane];
            if (st.images.length === 0) return;

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                stopPlay();
                stepSlice(1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                stopPlay();
                stepSlice(-1);
            } else if (e.key === 'PageDown') {
                e.preventDefault();
                stopPlay();
                stepSlice(5);
            } else if (e.key === 'PageUp') {
                e.preventDefault();
                stopPlay();
                stepSlice(-5);
            } else if (e.key === 'Home') {
                e.preventDefault();
                stopPlay();
                showSlice(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                stopPlay();
                showSlice(st.images.length - 1);
            } else if (e.key === 'r' || e.key === 'R') {
                resetView();
            } else if (e.key === '+' || e.key === '=') {
                st.scale = Math.min(st.scale * 1.2, 15);
                updateTransform();
            } else if (e.key === '-') {
                st.scale = Math.max(st.scale / 1.2, 0.5);
                updateTransform();
            }
        });

        applyLanguage(currentLang);
    </script>
</body>
</html>
