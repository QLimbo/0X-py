<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CT Viewer & Anatomical Glossary</title>
    <style>
        /* Night Theme (Default) */
        :root, [data-theme="dark"] {
            --bg-dark: #0b0d10;
            --viewport-bg: radial-gradient(circle at center, #13161c 0%, #07080a 100%);
            --panel-bg: #161920;
            --panel-border: #262b36;
            --card-bg: #11141a;
            --card-border: #222734;
            --card-hover: #3b4459;
            --input-bg: #0d0f14;
            --input-border: #2e3545;
            --btn-bg: #222733;
            --btn-border: #333a4b;
            --btn-hover: #2d3444;
            --control-bg: #1c2029;
            --overlay-bg: rgba(22, 25, 32, 0.86);
            --overlay-border: #334155;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --badge-bg: rgba(56, 189, 248, 0.14);
            --badge-border: rgba(56, 189, 248, 0.4);
            --badge-text: #7dd3fc;
            --badge-ocr-bg: rgba(168, 85, 247, 0.14);
            --badge-ocr-border: rgba(168, 85, 247, 0.4);
            --badge-ocr-text: #d8b4fe;
        }

        /* Day Theme */
        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --viewport-bg: radial-gradient(circle at center, #e2e8f0 0%, #cbd5e1 100%);
            --panel-bg: #ffffff;
            --panel-border: #cbd5e1;
            --card-bg: #f8fafc;
            --card-border: #e2e8f0;
            --card-hover: #94a3b8;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --btn-bg: #f1f5f9;
            --btn-border: #cbd5e1;
            --btn-hover: #e2e8f0;
            --control-bg: #f8fafc;
            --overlay-bg: rgba(255, 255, 255, 0.92);
            --overlay-border: #94a3b8;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #64748b;
            --badge-bg: rgba(2, 132, 199, 0.12);
            --badge-border: rgba(2, 132, 199, 0.35);
            --badge-text: #0369a1;
            --badge-ocr-bg: rgba(126, 34, 206, 0.1);
            --badge-ocr-border: rgba(126, 34, 206, 0.35);
            --badge-ocr-text: #6b21a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Top Toolbar */
        .toolbar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 8px 12px;
            padding-top: calc(8px + env(safe-area-inset-top, 0px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 30;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .title {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            color: var(--accent);
            margin-right: 4px;
            white-space: nowrap;
        }

        .plane-tabs, .lang-switch {
            display: inline-flex;
            background: var(--input-bg);
            padding: 3px;
            border-radius: 7px;
            border: 1px solid var(--panel-border);
        }

        .plane-tab, .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lang-btn {
            padding: 4px 7px;
            font-size: 11px;
        }

        .plane-tab:hover, .lang-btn:hover {
            color: var(--text-main);
        }

        .plane-tab.active, .lang-btn.active {
            background: var(--accent);
            color: #ffffff;
        }

        [data-theme="dark"] .plane-tab.active,
        [data-theme="dark"] .lang-btn.active {
            color: #000000;
        }

        .plane-count {
            font-size: 10.5px;
            opacity: 0.85;
            font-weight: 500;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent);
        }

        .btn:focus-visible, .plane-tab:focus-visible, .lang-btn:focus-visible, .pill-btn:focus-visible, .pin-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .btn-primary {
            background-color: #0369a1;
            color: #ffffff;
            border-color: #0284c7;
        }

        .btn-primary:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            font-weight: 600;
        }

        [data-theme="dark"] .btn.active {
            color: #000000;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--control-bg);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
        }

        .control-item input[type="range"] {
            width: 65px;
            accent-color: var(--accent);
            cursor: pointer;
            touch-action: pan-x;
        }

        .mobile-only {
            display: none !important;
        }

        /* Mobile Brightness/Contrast Popover Bar */
        .mobile-adjust-bar {
            display: none;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 6px 12px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 28;
        }

        .mobile-adjust-bar.visible {
            display: flex;
        }

        .mobile-adjust-bar .control-item {
            flex: 1;
            justify-content: space-between;
        }

        .mobile-adjust-bar input[type="range"] {
            width: 100%;
            flex: 1;
        }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            background: var(--viewport-bg);
            cursor: grab;
            touch-action: none;
        }

        .viewport.dragging {
            cursor: grabbing;
        }

        /* Multi-Screen 1x / 3x Grid */
        .panes-grid {
            flex: 1;
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .panes-grid.mode-3x {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background-color: var(--panel-border);
        }

        .plane-pane {
            position: relative;
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
            background: var(--viewport-bg);
            min-width: 0;
            min-height: 0;
        }

        .plane-pane.visible {
            display: flex;
        }

        .panes-grid.mode-3x .plane-pane {
            border: 2px solid transparent;
            transition: border-color 0.15s;
        }

        .panes-grid.mode-3x .plane-pane.active-pane {
            border-color: var(--accent);
        }

        .pane-header {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: none;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .panes-grid.mode-3x .pane-header {
            display: flex;
        }

        .pane-title-badge {
            background: var(--overlay-bg);
            border: 1px solid var(--panel-border);
            color: var(--accent);
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 5px;
            backdrop-filter: blur(4px);
        }

        .pane-slice-badge {
            background: var(--overlay-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            font-family: monospace;
            font-size: 11.5px;
            padding: 3px 7px;
            border-radius: 5px;
            backdrop-filter: blur(4px);
        }

        .pane-canvas-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
        }

        .pane-empty-msg {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 12px;
        }

        .slice-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            pointer-events: none;
            display: none;
            will-change: transform;
        }

        .slice-img.pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .pane-footer {
            display: none;
            padding: 5px 10px;
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            align-items: center;
            gap: 6px;
            z-index: 6;
            touch-action: pan-x;
        }

        .panes-grid.mode-3x .pane-footer {
            display: flex;
        }

        .pane-slider {
            flex: 1;
            accent-color: var(--accent);
            height: 6px;
            cursor: pointer;
            touch-action: pan-x;
        }

        /* 3x Magnifying Glass (Loupe) */
        .loupe {
            position: fixed;
            width: 184px;
            height: 184px;
            border-radius: 50%;
            border: 2.5px solid var(--accent);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            pointer-events: none;
            z-index: 100;
            display: none;
            background: #050608;
        }

        .loupe.visible {
            display: block;
        }

        .loupe-img {
            position: absolute;
            transform-origin: top left;
            pointer-events: none;
            max-width: none !important;
            max-height: none !important;
        }

        .loupe-img.pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .loupe-crosshair {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .loupe-crosshair::before,
        .loupe-crosshair::after {
            content: '';
            position: absolute;
            background: rgba(56, 189, 248, 0.35);
        }

        .loupe-crosshair::before {
            left: 50%;
            top: 38%;
            bottom: 38%;
            width: 1px;
            transform: translateX(-50%);
        }

        .loupe-crosshair::after {
            top: 50%;
            left: 38%;
            right: 38%;
            height: 1px;
            transform: translateY(-50%);
        }

        .loupe-badge {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 13, 16, 0.78);
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            font-family: monospace;
            padding: 1px 6px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        /* Clean Welcome Overlay */
        .drop-overlay {
            position: absolute;
            inset: 16px;
            border: 2px dashed var(--overlay-border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background-color: var(--overlay-bg);
            backdrop-filter: blur(4px);
            z-index: 15;
        }

        .drop-overlay.dragover {
            border-color: var(--accent);
        }

        .drop-overlay.hidden {
            display: none;
        }

        .drop-icon {
            font-size: 46px;
            margin-bottom: 12px;
        }

        .drop-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        .drop-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Glossary Sidebar */
        .sidebar {
            width: 410px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 25;
        }

        .sidebar.collapsed {
            display: none;
        }

        .sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-box {
            flex: 1;
            display: flex;
            position: relative;
        }

        .search-input {
            flex: 1;
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px 30px 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
            touch-action: manipulation;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .clear-search {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            display: none;
            padding: 4px;
        }

        .sidebar-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-pills {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        .pill-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .pill-btn.active {
            background: var(--badge-bg);
            color: var(--accent);
            border-color: var(--accent);
        }

        .ocr-status {
            font-size: 11.5px;
            color: #d97706;
            display: none;
            padding: 6px 8px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 5px;
            line-height: 1.4;
        }

        [data-theme="dark"] .ocr-status {
            color: #fbbf24;
        }

        .glossary-list {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .term-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px 10px;
            transition: border-color 0.12s;
            user-select: text;
            -webkit-user-select: text;
        }

        .term-card:hover {
            border-color: var(--card-hover);
        }

        .term-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 3px;
        }

        .term-lat {
            font-weight: 600;
            font-size: 13px;
            color: var(--accent);
        }

        .term-alias {
            font-weight: 400;
            font-size: 11.5px;
            color: var(--text-muted);
            display: block;
            margin-top: 1px;
        }

        .pin-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-muted);
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .pin-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .term-est, .term-rus {
            font-size: 12px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .term-est {
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .term-rus {
            color: var(--text-muted);
        }

        .lang-tag {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 700;
            font-family: monospace;
            padding: 1px 4px;
            border-radius: 3px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .term-links {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 6px;
        }

        .slice-badge {
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--badge-text);
            font-size: 11.5px;
            font-family: monospace;
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .slice-badge.ocr-link {
            background: var(--badge-ocr-bg);
            border-color: var(--badge-ocr-border);
            color: var(--badge-ocr-text);
        }

        .slice-badge:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        [data-theme="dark"] .slice-badge:hover {
            color: #000000;
        }

        .slice-badge .del-link {
            font-weight: bold;
            opacity: 0.7;
            padding-left: 3px;
        }

        .slice-badge .del-link:hover {
            opacity: 1;
        }

        /* Bottom Bar */
        .bottom-bar {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: 8px 14px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
            touch-action: pan-x;
        }

        .slice-counter {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            min-width: 115px;
            color: var(--accent);
            white-space: nowrap;
        }

        #sliceSlider {
            flex: 1;
            accent-color: var(--accent);
            height: 8px;
            cursor: pointer;
            touch-action: pan-x;
        }

        input[type="file"] {
            display: none;
        }

        /* Mobile & Tablet Responsive Optimization */
        @media (max-width: 820px) {
            .toolbar {
                padding: 6px 8px;
                padding-top: calc(6px + env(safe-area-inset-top, 0px));
                gap: 5px;
            }

            .toolbar-group {
                gap: 4px;
            }

            .title {
                display: none;
            }

            .desktop-only {
                display: none !important;
            }

            .mobile-only {
                display: inline-flex !important;
            }

            .plane-tab {
                padding: 5px 7px;
                font-size: 11.5px;
            }

            .btn {
                padding: 5px 8px;
                font-size: 11.5px;
            }

            .panes-grid.mode-3x {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, 1fr);
            }

            .panes-grid.mode-3x .pane-footer {
                padding: 3px 8px;
            }

            .sidebar {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 72%;
                border-left: none;
                border-top: 2px solid var(--accent);
                border-radius: 14px 14px 0 0;
                box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.55);
            }

            /* Prevents iOS Safari from auto-zooming the page when focusing the search input */
            .search-input {
                font-size: 16px;
                padding: 7px 30px 7px 10px;
            }

            .pill-btn, .pin-btn {
                padding: 5px 9px;
                font-size: 11.5px;
            }

            .slice-badge {
                padding: 4px 8px;
                font-size: 12px;
            }

            .bottom-bar {
                padding: 10px 10px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
                gap: 8px;
            }

            #sliceSlider {
                height: 12px;
            }

            .slice-counter {
                min-width: 86px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="toolbar-group">
            <div class="title">CT Viewer</div>

            <div class="plane-tabs">
                <button type="button" class="plane-tab active" data-plane="axial">
                    <span id="tab-label-axial">Axial</span> <span class="plane-count" id="count-axial">(0)</span>
                </button>
                <button type="button" class="plane-tab" data-plane="coronal">
                    <span id="tab-label-coronal">Coronal</span> <span class="plane-count" id="count-coronal">(0)</span>
                </button>
                <button type="button" class="plane-tab" data-plane="sagittal">
                    <span id="tab-label-sagittal">Sagittal</span> <span class="plane-count" id="count-sagittal">(0)</span>
                </button>

        // Day / Night Theme Initialization with prefers-color-scheme support

        if (window.innerWidth <= 820) {

        // Upload Buttons Trigger Hidden Inputs (Keyboard Accessible)
        loadBtnToolbar.addEventListener('click', () => unifiedInput.click());
        loadBtnOverlay.addEventListener('click', () => unifiedInput.click());
        loadFolderBtnToolbar.addEventListener('click', () => folderInput.click());
        loadFolderBtnOverlay.addEventListener('click', () => folderInput.click());

        // 2.2 Toggle 3x Multi-Screen Workstation Mode
        function setMultiView(enabled) {
            isMultiView = Boolean(enabled);
            multiViewBtn.classList.toggle('active', isMultiView);
            panesGrid.classList.toggle('mode-3x', isMultiView);

            PLANE_ORDER.forEach(p => {
                const visible = isMultiView || p === activePlane;
                paneElements[p].pane.classList.toggle('visible', visible);
                paneElements[p].pane.classList.toggle('active-pane', p === activePlane);

            updateFilters();
            syncOverlay();
        }

        multiViewBtn.addEventListener('click', () => setMultiView(!isMultiView));

        document.querySelectorAll('.plane-tab').forEach(btn => {
            btn.addEventListener('click', () => {

                switchPlane(btn.dataset.plane);

        // Clicking or interacting with a pane in 3x mode makes it the active plane
        PLANE_ORDER.forEach(p => {
            paneElements[p].pane.addEventListener('mousedown', () => {
                if (activePlane !== p) switchPlane(p, false);
            });
            paneElements[p].pane.addEventListener('touchstart', () => {

            }, { passive: true });
            paneElements[p].slider.addEventListener('input', e => {
                stopPlay();
                if (activePlane !== p) switchPlane(p, false);

        function updateBottomBarForActivePlane() {
            const st = planes[activePlane];
            if (st.images.length > 0) {
                sliceSlider.min = 0;
                sliceSlider.max = st.images.length - 1;
                sliceSlider.value = st.index;
                sliceSlider.disabled = false;
                sliceCounter.textContent = `${t('slice')}: ${st.index + 1} / ${st.images.length}`;
            } else {
                sliceSlider.min = 0;
                sliceSlider.max = 0;
                sliceSlider.value = 0;
                sliceSlider.disabled = true;
                sliceCounter.textContent = `${t('slice')}: 0 / 0`;
            }
        }

        function switchPlane(planeName, renderSlice = true) {
            if (!planes[planeName]) return;
            activePlane = planeName;

            document.querySelectorAll('.plane-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.plane === activePlane);
            });

            PLANE_ORDER.forEach(p => {
                const visible = isMultiView || p === activePlane;
                paneElements[p].pane.classList.toggle('visible', visible);
                paneElements[p].pane.classList.toggle('active-pane', p === activePlane);
            });

            dropTitle.textContent = t('dropTitle');
            const st = planes[activePlane];
            const pe = paneElements[activePlane];

            if (st.images.length > 0) {
                pe.img.style.display = 'block';
                pe.empty.style.display = 'none';
                updateTransform();
                if (renderSlice) showSliceForPlane(activePlane, st.index);
                else updateBottomBarForActivePlane();
            } else {
                pe.img.style.display = 'none';
                pe.empty.style.display = 'block';
                updateBottomBarForActivePlane();
            }

            syncOverlay();
        }

        function updatePlaneCounts() {
            PLANE_ORDER.forEach(p => {
                const len = planes[p].images.length;
                document.getElementById(`count-${p}`).textContent = `(${len})`;
                const pe = paneElements[p];
                if (len > 0) {
                    pe.slider.min = 0;
                    pe.slider.max = len - 1;
                    pe.slider.disabled = false;
                    pe.img.style.display = 'block';
                    pe.empty.style.display = 'none';
                } else {
                    pe.slider.min = 0;
                    pe.slider.max = 0;
                    pe.slider.value = 0;
                    pe.slider.disabled = true;
                    pe.counter.textContent = '0 / 0';
                    pe.img.style.display = 'none';
                    pe.empty.style.display = 'block';
                }
            });
        }

        // Only browser-supported raster/vector formats (TIFF only in Safari)
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        function isImageFilename(name) {
            if (isSafari && /\.tiff?$/i.test(name)) return true;
            return /\.(png|jpe?g|bmp|webp|gif|avif|svg)$/i.test(name);
        }

        function isZipFilename(name) {
            return /\.zip$/i.test(name);
        }

        function isOtherArchiveFilename(name) {
            return /\.(7z|rar|tar|gz|tgz|bz2|xz)$/i.test(name);
        }

        function detectPlaneFromPath(pathStr) {
            const p = pathStr.toLowerCase();
            if (/\b(axial|ax)\b/.test(p) || p.includes('axial') || p.includes('_ax_')) return 'axial';
            if (/\b(coronal|cor)\b/.test(p) || p.includes('coronal') || p.includes('_cor_')) return 'coronal';
            if (/\b(sagittal|sag)\b/.test(p) || p.includes('sagittal') || p.includes('_sag_')) return 'sagittal';
            return null;
        }

        // Lightweight ±3 neighbor slice preloader (prevents multi-GB RAM spikes)
        function preloadAroundSlice(planeName, centerIdx) {
            const imgs = planes[planeName].images;
            for (let i = 0; i < imgs.length; i++) {
                const dist = Math.abs(i - centerIdx);
                if (dist <= 3) {
                    if (!imgs[i].preloadRef) {
                        const im = new Image();
                        im.decoding = 'async';
                        im.src = imgs[i].url;
                        im.decode?.().catch(() => {});
                        imgs[i].preloadRef = im;
                    }
                } else if (dist > 8 && imgs[i].preloadRef) {
                    imgs[i].preloadRef = null;
                }
            }
        }

        function setPlaneFiles(planeName, itemArray) {
            const st = planes[planeName];
            st.images.forEach(item => URL.revokeObjectURL(item.url));

            // Sort by fullPath using shared Intl.Collator
            itemArray.sort((a, b) => fileCollator.compare(a.fullPath || a.name, b.fullPath || b.name));

            st.images = itemArray.map(item => ({
                name: item.name,
                fullPath: item.fullPath || item.name,
                url: URL.createObjectURL(item.blob),
                preloadRef: null,
                ocrText: '',
                ocrNorm: ''
            }));

            st.index = 0;
            if (st.images.length > 0) {
                preloadAroundSlice(planeName, 0);
            }
        }

        // Dynamic loader for libarchive.js (.7z, .rar, .tar, .gz, .bz2, .xz)
        let libarchiveReadyPromise = null;
        async function getLibArchive() {
            if (!libarchiveReadyPromise) {
                libarchiveReadyPromise = (async () => {
                    const mod = await import('https://cdn.jsdelivr.net/npm/libarchive.js@2.0.2/main.js');
                    const workerResp = await fetch('https://cdn.jsdelivr.net/npm/libarchive.js@2.0.2/dist/worker-bundle.js');
                    const workerCode = await workerResp.text();
                    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
                    const workerUrl = URL.createObjectURL(workerBlob);
                    mod.Archive.init({ workerUrl });
                    return mod.Archive;
                })();
            }
            return libarchiveReadyPromise;
        }

        async function collectLibArchiveEntries(obj, currentPath, outList) {
            for (const key of Object.keys(obj)) {
                const val = obj[key];
                const fullPath = currentPath ? `${currentPath}/${key}` : key;
                if (val && typeof val.extract === 'function') {
                    if (!fullPath.includes('__MACOSX') && isImageFilename(key)) {
                        const extractedFile = await val.extract();
                        outList.push({
                            name: key,
                            fullPath: fullPath,
                            blob: extractedFile
                        });
                    }
                } else if (val && typeof val === 'object') {
                    await collectLibArchiveEntries(val, fullPath, outList);
                }
            }
        }

        async function readDroppedEntries(dataTransferItems) {
            const filesWithPaths = [];

            async function traverseEntry(entry, pathPrefix) {
                if (!entry) return;
                if (entry.isFile) {
                    const file = await new Promise(res => entry.file(res, () => res(null)));
                    if (file) {
                        filesWithPaths.push({
                            file,
                            fullPath: pathPrefix ? `${pathPrefix}/${file.name}` : file.name
                        });
                    }
                } else if (entry.isDirectory) {
                    const reader = entry.createReader();
                    let batch = [];
                    do {
                        batch = await new Promise(res => reader.readEntries(res, () => res([])));
                        for (const child of batch) {
                            await traverseEntry(child, pathPrefix ? `${pathPrefix}/${entry.name}` : entry.name);
                        }
                    } while (batch.length > 0);
                }
            }

            const entries = [];
            for (let i = 0; i < dataTransferItems.length; i++) {
                const item = dataTransferItems[i];
                if (item.webkitGetAsEntry) {
                    const entry = item.webkitGetAsEntry();
                    if (entry) entries.push(entry);
                }
            }

            for (const entry of entries) {
                await traverseEntry(entry, '');
            }
            return filesWithPaths;
        }

        async function loadFiles(fileList, customPaths = null) {
            stopPlay();
            const extractedItems = [];
            const zipFiles = [];
            const otherArchives = [];

            try {
                const itemsToProcess = customPaths || Array.from(fileList).map(f => ({
                    file: f,
                    fullPath: f.webkitRelativePath ? f.webkitRelativePath : f.name
                }));

                itemsToProcess.forEach(({ file, fullPath }) => {
                    if (isZipFilename(file.name)) {
                        zipFiles.push(file);
                    } else if (isOtherArchiveFilename(file.name)) {
                        otherArchives.push(file);
                    } else if (isImageFilename(file.name)) {
                        extractedItems.push({
                            name: file.name,
                            fullPath: fullPath,
                            blob: file
                        });
                    }
                });

                if (zipFiles.length > 0) {
                    dropOverlay.classList.remove('hidden');
                    dropTitle.textContent = t('extractingZip');
                    try {
                        const JSZipLib = await ensureJSZip();
                        for (const zf of zipFiles) {
                            try {
                                const zip = await JSZipLib.loadAsync(zf);
                                const entries = [];
                                zip.forEach((relativePath, zipEntry) => {
                                    if (!zipEntry.dir && !relativePath.includes('__MACOSX') && isImageFilename(zipEntry.name)) {
                                        entries.push({ relativePath, zipEntry });
                                    }
                                });
                                for (const entry of entries) {
                                    const blob = await entry.zipEntry.async('blob');
                                    const shortName = entry.relativePath.split('/').pop();
                                    extractedItems.push({
                                        name: shortName,
                                        fullPath: entry.relativePath,
                                        blob: blob
                                    });
                                }
                            } catch (err) {
                                otherArchives.push(zf);
                            }
                        }
                    } catch (e) {
                        otherArchives.push(...zipFiles);
                    }
                }

                if (otherArchives.length > 0) {
                    dropOverlay.classList.remove('hidden');
                    dropTitle.textContent = t('extractingArch');
                    try {
                        const Archive = await getLibArchive();
                        for (const archFile of otherArchives) {
                            const archive = await Archive.open(archFile);
                            const filesObj = await archive.getFilesObject();
                            await collectLibArchiveEntries(filesObj, '', extractedItems);
                        }
                    } catch (err) {
                        alert(t('alertArchFail'));
                    }
                }

                if (extractedItems.length === 0) {
                    alert(t('alertNoValid'));
                    return;
                }

                const buckets = { axial: [], coronal: [], sagittal: [], unknown: [] };
                extractedItems.forEach(item => {
                    const detected = detectPlaneFromPath(item.fullPath);
                    if (detected) buckets[detected].push(item);
                    else buckets.unknown.push(item);
                });

                const hasAutoDetected = buckets.axial.length > 0 || buckets.coronal.length > 0 || buckets.sagittal.length > 0;

                if (hasAutoDetected) {
                    if (buckets.axial.length > 0) setPlaneFiles('axial', buckets.axial);
                    if (buckets.coronal.length > 0) setPlaneFiles('coronal', buckets.coronal);
                    if (buckets.sagittal.length > 0) setPlaneFiles('sagittal', buckets.sagittal);
                    if (buckets.unknown.length > 0 && planes[activePlane].images.length === 0) {
                        setPlaneFiles(activePlane, buckets.unknown);
                    }

                    updatePlaneCounts();
                    PLANE_ORDER.forEach(p => {
                        if (planes[p].images.length > 0) showSliceForPlane(p, 0);
                    });

                    const loadedPlanesCount = PLANE_ORDER.filter(p => planes[p].images.length > 0).length;
                    if (loadedPlanesCount >= 2 && isMultiView) {
                        setMultiView(true);
                    }

                    if (buckets[activePlane].length > 0) switchPlane(activePlane);
                    else if (buckets.axial.length > 0) switchPlane('axial');
                    else if (buckets.coronal.length > 0) switchPlane('coronal');
                    else if (buckets.sagittal.length > 0) switchPlane('sagittal');
                } else {
                    setPlaneFiles(activePlane, extractedItems);
                    updatePlaneCounts();
                    switchPlane(activePlane);
                }

                updateDatasetFingerprint();
                renderGlossary();
            } finally {
                dropTitle.textContent = t('dropTitle');
                syncOverlay();
            }
        }

        function showSliceForPlane(planeName, index) {
            const st = planes[planeName];
            const pe = paneElements[planeName];
            if (st.images.length === 0) return;
            if (index < 0) index = 0;
            if (index >= st.images.length) index = st.images.length - 1;

            st.index = index;
            const current = st.images[st.index];
            pe.img.src = current.url;
            pe.slider.value = st.index;
            pe.counter.textContent = `${st.index + 1} / ${st.images.length}`;

            preloadAroundSlice(planeName, st.index);

            if (planeName === activePlane) {
                updateBottomBarForActivePlane();
            }
            if (loupeState.active && loupeState.plane === planeName) {
                loupeImg.src = current.url;
            }
        }

        function showSlice(index) {
            showSliceForPlane(activePlane, index);
        }

        // Step slices for a specific plane or seamlessly across Axial <-> Coronal <-> Sagittal
        function stepSlice(delta, specificPlane = null) {
            if (delta === 0) return false;

            if (specificPlane && planes[specificPlane].images.length > 0) {
                const st = planes[specificPlane];
                const prevIdx = st.index;
                const nextIdx = Math.min(Math.max(prevIdx + delta, 0), st.images.length - 1);
                if (activePlane !== specificPlane) switchPlane(specificPlane, false);
                showSliceForPlane(specificPlane, nextIdx);
                return nextIdx !== prevIdx;
            }

            const nonEmptyPlanes = PLANE_ORDER.filter(p => planes[p].images.length > 0);
            if (nonEmptyPlanes.length === 0) return false;

            if (planes[activePlane].images.length === 0) {
                switchPlane(nonEmptyPlanes[0]);
                showSlice(0);
                return true;
            }

            let targetPlane = activePlane;
            let targetIndex = planes[targetPlane].index + delta;

            while (targetIndex >= planes[targetPlane].images.length) {
                const curOrderIdx = nonEmptyPlanes.indexOf(targetPlane);
                if (curOrderIdx < nonEmptyPlanes.length - 1) {
                    targetIndex -= planes[targetPlane].images.length;
                    targetPlane = nonEmptyPlanes[curOrderIdx + 1];
                } else {
                    targetIndex = planes[targetPlane].images.length - 1;
                    if (targetPlane !== activePlane) switchPlane(targetPlane, false);
                    showSliceForPlane(targetPlane, targetIndex);
                    return false;
                }
            }

            while (targetIndex < 0) {
                const curOrderIdx = nonEmptyPlanes.indexOf(targetPlane);
                if (curOrderIdx > 0) {
                    targetPlane = nonEmptyPlanes[curOrderIdx - 1];
                    targetIndex += planes[targetPlane].images.length;
                } else {
                    targetIndex = 0;
                    if (targetPlane !== activePlane) switchPlane(targetPlane, false);
                    showSliceForPlane(targetPlane, 0);
                    return false;
                }
            }

            if (targetPlane !== activePlane) {
                switchPlane(targetPlane, false);
            }
            showSliceForPlane(targetPlane, targetIndex);
            return true;
        }

        function updateTransform() {
            const transformStr = `translate(${viewState.panX}px, ${viewState.panY}px) scale(${viewState.scale})`;
            PLANE_ORDER.forEach(p => {
                paneElements[p].img.style.transform = transformStr;
            });
            zoomLabel.textContent = `${Math.round(viewState.scale * 100)}%`;
        }

        // Unified focal-point zoom helper (keeps focal point stationary under cursor/fingers)
        function zoomAtClientPoint(targetScale, clientX = null, clientY = null, planeHint = null) {
            const clampedScale = Math.min(Math.max(targetScale, 0.5), 15);
            if (clampedScale === viewState.scale) return;

            if (clampedScale <= 1) {
                viewState.scale = clampedScale;
                viewState.panX = 0;
                viewState.panY = 0;
                updateTransform();
                return;
            }

            const ratio = clampedScale / viewState.scale;
            if (clientX !== null && clientY !== null) {
                const refPlane = planeHint || findPlaneAtPoint(clientX, clientY) || activePlane;
                const rect = paneElements[refPlane].pane.getBoundingClientRect();
                const offsetX = clientX - rect.left - rect.width / 2;
                const offsetY = clientY - rect.top - rect.height / 2;
                viewState.panX = offsetX - (offsetX - viewState.panX) * ratio;
                viewState.panY = offsetY - (offsetY - viewState.panY) * ratio;
            } else {
                viewState.panX *= ratio;
                viewState.panY *= ratio;
            }

            viewState.scale = clampedScale;
            updateTransform();
        }

        function updateFilters() {
            const isDefault = brightness === 100 && contrast === 100 && !inverted;
            const filterStr = isDefault
                ? 'none'
                : `brightness(${brightness}%) contrast(${contrast}%) invert(${inverted ? 100 : 0}%)`;

            PLANE_ORDER.forEach(p => {
                paneElements[p].img.style.filter = filterStr;
                paneElements[p].img.classList.toggle('pixelated', isPixelated);
            });
            loupeImg.style.filter = filterStr;
            loupeImg.classList.toggle('pixelated', isPixelated);
        }

        function resetView() {
            viewState.scale = 1;
            viewState.panX = 0;
            viewState.panY = 0;
            brightness = 100;
            contrast = 100;
            inverted = false;
            brightnessRange.value = 100;
            contrastRange.value = 100;
            brightnessRangeMobile.value = 100;
            contrastRangeMobile.value = 100;
            invertBtn.classList.remove('active');
            updateTransform();
            updateFilters();
        }

        // --- Sequential Play Across Axial -> Coronal -> Sagittal ---
        function stopPlay() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            playBtn.textContent = t('play');
            playBtn.classList.remove('active');
        }

        function togglePlay() {
            if (playInterval) {
                stopPlay();
                return;
            }

            const nonEmptyPlanes = PLANE_ORDER.filter(p => planes[p].images.length > 0);
            if (nonEmptyPlanes.length === 0) return;

            const lastPlane = nonEmptyPlanes[nonEmptyPlanes.length - 1];
            const isAtVeryEnd =
                activePlane === lastPlane &&
                planes[lastPlane].index >= planes[lastPlane].images.length - 1;

            if (planes[activePlane].images.length === 0 || isAtVeryEnd) {
                switchPlane(nonEmptyPlanes[0], false);
                showSlice(0);
            }

            playBtn.textContent = t('pause');
            playBtn.classList.add('active');

            playInterval = setInterval(() => {
                const moved = stepSlice(1);
                if (!moved) {
                    stopPlay();
                }
            }, 120);
        }

        playBtn.addEventListener('click', togglePlay);

        // Separate query navigation from renderGlossary so pinning/OCR never jumps slices
        function jumpToSliceFromQuery(rawQuery) {
            const q = normalizeSearch(rawQuery);
            if (!q) return;
            const st = planes[activePlane];
            if (st.images.length === 0) return;

            const numMatch = rawQuery.trim().match(/^#?(\d+)$/);
            if (numMatch) {
                const targetSlice = parseInt(numMatch[1], 10) - 1;
                if (targetSlice >= 0 && targetSlice < st.images.length) {
                    showSlice(targetSlice);
                }
                return;
            }

            const fileIdx = st.images.findIndex(img =>
                normalizeSearch(img.name).includes(q) ||
                (img.ocrNorm && img.ocrNorm.includes(q))
            );
            if (fileIdx !== -1) showSlice(fileIdx);
        }

        function renderGlossary() {
            const rawQuery = searchInput.value.trim();
            const query = normalizeSearch(rawQuery);
            clearSearchBtn.style.display = rawQuery ? 'block' : 'none';

            const fragment = document.createDocumentFragment();
            let visibleCount = 0;

            GLOSSARY_DATA.forEach(entry => {
                const { lat, aliases, est, rus, searchLat, searchEst, searchRus } = entry;
                const links = termLinks[lat] || [];
                if (showOnlyPinned && links.length === 0) return;

                if (query) {
                    const matchLat = searchLat.includes(query);
                    const matchEst = searchEst.includes(query);
                    const matchRus = searchRus.includes(query);
                    const matchLink = links.some(l => `${l.plane} ${l.slice}`.toLowerCase().includes(query));
                    if (!matchLat && !matchEst && !matchRus && !matchLink) return;
                }

                visibleCount++;
                const card = document.createElement('div');

                pinBtn.textContent = t('pinBtn');
                pinBtn.addEventListener('click', () => pinTermToCurrentSlice(lat));

                topRow.appendChild(pinBtn);

                const estEl = document.createElement('div');
                estEl.className = 'term-est';
                const estTag = document.createElement('span');
                estTag.className = 'lang-tag';
                estTag.textContent = 'ET';
                const estText = document.createElement('span');
                estText.textContent = est;
                estEl.append(estTag, estText);

                const rusEl = document.createElement('div');
                rusEl.className = 'term-rus';
                const rusTag = document.createElement('span');
                rusTag.className = 'lang-tag';
                rusTag.textContent = 'RU';

                rusText.textContent = rus;
                rusEl.append(rusTag, rusText);

                card.appendChild(topRow);
                card.appendChild(estEl);
                card.appendChild(rusEl);

                if (links.length > 0) {
                    const linksRow = document.createElement('div');
                    linksRow.className = 'term-links';

                    links.forEach((lnk, idx) => {
                        const badge = document.createElement('span');
                        badge.className = 'slice-badge' + (lnk.source === 'ocr' ? ' ocr-link' : '');

                        badge.addEventListener('click', e => {

        }

        function pinTermToCurrentSlice(lat) {
            const st = planes[activePlane];
            if (st.images.length === 0) return;
            const sliceNum = st.index + 1;
            if (!termLinks[lat]) termLinks[lat] = [];
            const existing = termLinks[lat].find(l => l.plane === activePlane && l.slice === sliceNum);
            if (!existing) {
                termLinks[lat].push({ plane: activePlane, slice: sliceNum, source: 'manual' });
                saveTermLinks();
                renderGlossary();
            } else if (existing.source === 'ocr') {
                existing.source = 'manual';
                saveTermLinks();
                renderGlossary();
            }
        }

        function removeTermLink(lat, idx) {
            if (!termLinks[lat]) return;
            termLinks[lat].splice(idx, 1);
            if (termLinks[lat].length === 0) delete termLinks[lat];
            saveTermLinks();
            renderGlossary();
        }

        // --- High-Accuracy Multi-Threaded OCR Engine ---
        function normalizeText(str) {
            return (str || '')
                .toLowerCase()
                .replace(/ё/g, 'е')
                .replace(/[ōòóô]/g, 'õ')
                .replace(/[-–—/\\:;.,()[\]]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function skeletonText(str) {
            return normalizeText(str)
                .replace(/[0õö]/g, 'o')
                .replace(/[1l|]/g, 'i')
                .replace(/ä/g, 'a')
                .replace(/ü/g, 'u')
                .replace(/й/g, 'и');
        }

        // Short vernacular words that cause false positives in OCR if matched alone
        const OCR_SHORT_STOPWORDS = new Set(['pea', 'suu', 'ige', 'oim', 'luu', 'рот', 'ухо', 'нос', 'шея', 'лоб']);

        function getTermCandidates(entry) {
            const rawList = [];
            const addCand = (s, isVernacular = false) => {
                const noBrackets = (s || '').replace(/\[.*?\]/g, '').trim();
                const n = normalizeText(noBrackets);
                if (!n) return;
                if (isVernacular && n.length < 4) return;
                if (!isVernacular && n.length < 3) return;
                if (OCR_SHORT_STOPWORDS.has(n)) return;
                if (!rawList.includes(n)) rawList.push(n);
            };

            [entry.lat, ...entry.aliases].forEach(latName => {
                const latNoBrackets = latName.replace(/\[.*?\]/g, '').trim();
                addCand(latNoBrackets, false);

                if (latNoBrackets.includes(':') || latNoBrackets.includes(';')) {
                    const subParts = latNoBrackets.split(/[:;]/).map(s => s.trim());
                    subParts.slice(1).forEach(sp => addCand(sp, false));
                }
            });

            const estClean = entry.est.replace(/\[.*?\]/g, '').trim();
            addCand(estClean.split('(')[0], true);
            const estParen = estClean.match(/\(([^)]+)\)/);
            if (estParen) addCand(estParen[1], true);

            const rusClean = entry.rus.replace(/\[.*?\]/g, '').trim();
            addCand(rusClean.split('(')[0], true);
            const rusParen = rusClean.match(/\(([^)]+)\)/);
            if (rusParen) addCand(rusParen[1], true);

            return rawList.map(cand => {
                const skelCand = skeletonText(cand);
                return {
                    cand,
                    skelCand,
                    isShort: cand.length <= 5,
                    candWords: skelCand.split(' ').filter(w => w.length >= 2)
                };
            });
        }

        const PRECOMPILED_GLOSSARY = GLOSSARY_DATA.map(entry => ({
            lat: entry.lat,
            candidates: getTermCandidates(entry)
        }));

        // Reusable buffer for fast bounded Levenshtein distance
        const dpBuffer = new Int32Array(128);
        function editDistance(a, b, maxAllowed) {
            const lenA = a.length;
            const lenB = b.length;
            if (Math.abs(lenA - lenB) > maxAllowed) return maxAllowed + 1;
            if (lenA === 0) return lenB;
            if (lenB === 0) return lenA;

            for (let i = 0; i <= lenA; i++) dpBuffer[i] = i;

            for (let j = 1; j <= lenB; j++) {
                let prev = dpBuffer[0];
                dpBuffer[0] = j;
                let rowMin = dpBuffer[0];
                const bChar = b.charCodeAt(j - 1);
                for (let i = 1; i <= lenA; i++) {
                    const temp = dpBuffer[i];
                    const cost = a.charCodeAt(i - 1) === bChar ? prev : 1 + Math.min(prev, dpBuffer[i], dpBuffer[i - 1]);
                    dpBuffer[i] = cost;
                    if (cost < rowMin) rowMin = cost;
                    prev = temp;
                }
                if (rowMin > maxAllowed) return maxAllowed + 1;
            }
            return dpBuffer[lenA];
        }

        function matchSliceOCRBestCandidate(compiledCandidates, paddedNorm, paddedSkel, normSlice, skelSlice, skelWords, skelWordSet) {
            let bestMatchedCand = null;

            const recordMatch = candStr => {
                if (!bestMatchedCand || candStr.length > bestMatchedCand.length) {
                    bestMatchedCand = candStr;
                }
            };

            for (const { cand, skelCand, isShort, candWords } of compiledCandidates) {
                if (isShort) {
                    if (paddedNorm.includes(` ${cand} `) || paddedSkel.includes(` ${skelCand} `)) {
                        recordMatch(skelCand);
                    }
                    continue;
                }

                if (normSlice.includes(cand) || skelSlice.includes(skelCand)) {
                    recordMatch(skelCand);
                    continue;
                }

                const cLen = candWords.length;
                if (cLen > 0 && skelWords.length >= cLen) {
                    const firstTarget = candWords[0];
                    const firstMaxErr = firstTarget.length >= 7 ? 2 : (firstTarget.length >= 5 ? 1 : 0);

                    if (firstMaxErr === 0 && !skelWordSet.has(firstTarget)) {
                        continue;
                    }

                    const limit = skelWords.length - cLen;
                    for (let idx = 0; idx <= limit; idx++) {
                        const firstActual = skelWords[idx];
                        if (Math.abs(firstTarget.length - firstActual.length) > firstMaxErr) continue;
                        if (firstMaxErr === 0 ? firstTarget !== firstActual : editDistance(firstTarget, firstActual, firstMaxErr) > firstMaxErr) {
                            continue;
                        }

                        let allWordsClose = true;
                        for (let w = 1; w < cLen; w++) {
                            const targetW = candWords[w];
                            const actualW = skelWords[idx + w];
                            const maxErr = targetW.length >= 7 ? 2 : (targetW.length >= 5 ? 1 : 0);
                            if (Math.abs(targetW.length - actualW.length) > maxErr) {
                                allWordsClose = false;
                                break;
                            }
                            if (maxErr === 0 ? targetW !== actualW : editDistance(targetW, actualW, maxErr) > maxErr) {
                                allWordsClose = false;
                                break;
                            }
                        }
                        if (allWordsClose) {
                            recordMatch(skelCand);
                            break;
                        }
                    }
                }
            }
            return bestMatchedCand;
        }

        async function prepareHighResOCRBlob(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    if (img.width >= 1400) {
                        resolve(url);
                        return;
                    }
                    const scale = 1.5;
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => {
                        canvas.width = 0;
                        canvas.height = 0;
                        resolve(blob || url);
                    }, 'image/png');
                };
                img.onerror = () => resolve(url);
                img.src = url;
            });
        }

        ocrScanBtn.addEventListener('click', async () => {
            if (isScanningOCR) {
                cancelOCRRequested = true;
                ocrStatus.textContent = t('ocrStopping');
                return;
            }

            const jobs = [];
            PLANE_ORDER.forEach(planeName => {
                planes[planeName].images.forEach((imgObj, idx) => {
                    jobs.push({ planeName, imgObj, sliceNum: idx + 1 });
                });
            });

            if (jobs.length === 0) {
                alert(t('alertLoadFirst'));
                return;
            }

            isScanningOCR = true;
            cancelOCRRequested = false;
            ocrStatus.style.display = 'block';
            ocrScanBtn.classList.add('active');
            ocrScanBtn.textContent = t('ocrStop');

            let matchedTotal = 0;
            let completedSlices = 0;
            let scheduler = null;

            try {
                const TesseractLib = await ensureTesseract();
                const isMobileDevice = window.innerWidth <= 820 || /Mobi|Android/i.test(navigator.userAgent);
                const maxThreads = isMobileDevice ? 2 : 4;
                const numWorkers = Math.min(navigator.hardwareConcurrency || maxThreads, maxThreads);

                ocrStatus.textContent = t('ocrStarting')(numWorkers, jobs.length);

                scheduler = TesseractLib.createScheduler();
                await Promise.all(Array.from({ length: numWorkers }, async () => {
                    const w = await TesseractLib.createWorker(['eng', 'est', 'rus']);
                    await w.setParameters({ tessedit_pageseg_mode: '11' });
                    scheduler.addWorker(w);
                }));

                // Bounded concurrency worker pool (prevents memory blowup on 100+ slices)
                let nextJobIndex = 0;
                const runner = async () => {
                    while (!cancelOCRRequested) {
                        const i = nextJobIndex++;
                        if (i >= jobs.length) break;
                        const { planeName, imgObj, sliceNum } = jobs[i];

                        try {
                            let normSlice = imgObj.ocrText;
                            let skelSlice = '';

                            if (!normSlice) {
                                const hiResBlob = await prepareHighResOCRBlob(imgObj.url);
                                if (cancelOCRRequested) break;

                                const ret = await scheduler.addJob('recognize', hiResBlob);
                                if (cancelOCRRequested) break;

                                let reconstructedLines = ret.data.text || '';
                                if (ret.data.lines && ret.data.lines.length > 1) {
                                    const lines = ret.data.lines.slice().sort((a, b) => a.bbox.y0 - b.bbox.y0);
                                    for (let a = 0; a < lines.length; a++) {
                                        for (let b = a + 1; b < lines.length; b++) {
                                            const dy = lines[b].bbox.y0 - lines[a].bbox.y1;
                                            if (dy > 36) break;
                                            const dx = Math.abs(lines[b].bbox.x0 - lines[a].bbox.x0);
                                            if (dy >= -8 && dx <= 140) {
                                                reconstructedLines += ' ' + lines[a].text + ' ' + lines[b].text;
                                            }
                                        }
                                    }
                                }

                                normSlice = normalizeText(reconstructedLines);
                                skelSlice = skeletonText(reconstructedLines);
                                imgObj.ocrText = normSlice;
                                imgObj.ocrNorm = normalizeSearch(reconstructedLines);
                            } else {
                                skelSlice = skeletonText(normSlice);
                            }

                            const paddedNorm = ` ${normSlice} `;
                            const paddedSkel = ` ${skelSlice} `;
                            const skelWords = skelSlice.split(' ').filter(Boolean);
                            const skelWordSet = new Set(skelWords);

                            const rawMatches = [];
                            PRECOMPILED_GLOSSARY.forEach(({ lat, candidates }) => {
                                const matchedCand = matchSliceOCRBestCandidate(
                                    candidates, paddedNorm, paddedSkel, normSlice, skelSlice, skelWords, skelWordSet
                                );
                                if (matchedCand) {
                                    rawMatches.push({ lat, matchedCand });
                                }
                            });

                            // Filter out nested substring matches (e.g. "sinus frontalis" inside "apertura sinus frontalis")
                            const filteredMatches = rawMatches.filter(m =>
                                !rawMatches.some(other =>
                                    other.lat !== m.lat &&
                                    other.matchedCand.length > m.matchedCand.length &&
                                    ` ${other.matchedCand} `.includes(` ${m.matchedCand} `)
                                )
                            );

                            let foundNewOnSlice = false;
                            filteredMatches.forEach(({ lat }) => {
                                if (!termLinks[lat]) termLinks[lat] = [];
                                if (!termLinks[lat].some(l => l.plane === planeName && l.slice === sliceNum)) {
                                    termLinks[lat].push({ plane: planeName, slice: sliceNum, source: 'ocr' });
                                    matchedTotal++;
                                    foundNewOnSlice = true;
                                }
                            });

                            completedSlices++;
                            ocrStatus.textContent = t('ocrProgress')(completedSlices, jobs.length, matchedTotal);
                            if (foundNewOnSlice && completedSlices % 3 === 0) {
                                renderGlossary();
                            }
                        } catch (sliceErr) {
                            completedSlices++;
                        }
                    }
                };

                await Promise.all(Array.from({ length: numWorkers }, runner));

                ocrStatus.textContent = cancelOCRRequested
                    ? t('ocrStopped')(matchedTotal)
                    : t('ocrComplete')(matchedTotal, jobs.length);
            } catch (err) {
                ocrStatus.textContent = t('ocrInterrupted');
            } finally {
                if (scheduler) {
                    try { await scheduler.terminate(); } catch (e) {}
                }
                saveTermLinks();
                renderGlossary();
                isScanningOCR = false;
                cancelOCRRequested = false;
                ocrScanBtn.classList.remove('active');
                ocrScanBtn.textContent = t('ocrScan');
            }
        });

        clearOcrBtn.addEventListener('click', () => {
            for (const lat of Object.keys(termLinks)) {
                termLinks[lat] = termLinks[lat].filter(l => l.source !== 'ocr');
                if (termLinks[lat].length === 0) delete termLinks[lat];
            }
            PLANE_ORDER.forEach(p => {
                planes[p].images.forEach(img => {
                    img.ocrText = '';
                    img.ocrNorm = '';
                });
            });
            saveTermLinks();
            renderGlossary();
        });

        // Unified File Input, Folder Input & Drag-and-Drop Listeners
        unifiedInput.addEventListener('change', e => {

        window.addEventListener('dragover', e => {
