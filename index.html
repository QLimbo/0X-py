        // --- 2.3 3x Magnifying Glass (Loupe) Implementation ---
        const LOUPE_SIZE = 184;
        const LOUPE_RADIUS = LOUPE_SIZE / 2;
        const LOUPE_ZOOM = 3;
        const loupeState = {
            active: false,
            plane: null,
            isTouch: false
        };

        function findPlaneAtPoint(clientX, clientY) {
            if (!isMultiView) {
                return planes[activePlane].images.length > 0 ? activePlane : null;
            }
            for (const p of PLANE_ORDER) {
                if (planes[p].images.length === 0) continue;
                const r = paneElements[p].pane.getBoundingClientRect();
                if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
                    return p;
                }
            }
            return null;
        }

        function getRenderedImageRect(imgEl) {
            const rect = imgEl.getBoundingClientRect();
            const nw = imgEl.naturalWidth || rect.width;
            const nh = imgEl.naturalHeight || rect.height;
            if (!nw || !nh) return rect;
            const imgRatio = nw / nh;
            const boxRatio = rect.width / rect.height;
            let renderW = rect.width;
            let renderH = rect.height;
            let offsetX = 0;
            let offsetY = 0;
            if (boxRatio > imgRatio) {
                renderW = rect.height * imgRatio;
                offsetX = (rect.width - renderW) / 2;
            } else {
                renderH = rect.width / imgRatio;
                offsetY = (rect.height - renderH) / 2;
            }
            return {
                left: rect.left + offsetX,
                top: rect.top + offsetY,
                width: renderW,
                height: renderH
            };
        }

        function activateLoupe(clientX, clientY, isTouch = false) {
            const planeUnder = findPlaneAtPoint(clientX, clientY);
            if (!planeUnder) return false;
            const st = planes[planeUnder];
            if (st.images.length === 0) return false;

            loupeState.active = true;
            loupeState.plane = planeUnder;
            loupeState.isTouch = isTouch;
            loupeImg.src = st.images[st.index].url;
            loupe.classList.add('visible');
            updateLoupePosition(clientX, clientY);
            return true;
        }

        function updateLoupePosition(clientX, clientY) {
            if (!loupeState.active) return;
            const planeUnder = findPlaneAtPoint(clientX, clientY) || loupeState.plane;
            if (planeUnder && planeUnder !== loupeState.plane && planes[planeUnder].images.length > 0) {
                loupeState.plane = planeUnder;
                loupeImg.src = planes[planeUnder].images[planes[planeUnder].index].url;
            }

            const targetImg = paneElements[loupeState.plane].img;
            const imgRect = getRenderedImageRect(targetImg);

            const relX = clientX - imgRect.left;
            const relY = clientY - imgRect.top;

            loupeImg.style.width = `${imgRect.width * LOUPE_ZOOM}px`;
            loupeImg.style.height = `${imgRect.height * LOUPE_ZOOM}px`;
            loupeImg.style.left = `${LOUPE_RADIUS - relX * LOUPE_ZOOM}px`;
            loupeImg.style.top = `${LOUPE_RADIUS - relY * LOUPE_ZOOM}px`;

            // Offset upward on touch so thumb/finger doesn't cover the loupe, clamped to screen bounds
            const touchOffsetY = loupeState.isTouch ? -112 : 0;
            const maxLeft = window.innerWidth - LOUPE_SIZE - 6;
            const maxTop = window.innerHeight - LOUPE_SIZE - 6;
            const clampedLeft = Math.min(Math.max(6, clientX - LOUPE_RADIUS), Math.max(6, maxLeft));
            const clampedTop = Math.min(Math.max(6, clientY - LOUPE_RADIUS + touchOffsetY), Math.max(6, maxTop));

            loupe.style.left = `${clampedLeft}px`;
            loupe.style.top = `${clampedTop}px`;
        }

        function hideLoupe() {
            loupeState.active = false;
            loupe.classList.remove('visible');
        }

        viewport.addEventListener('contextmenu', e => {
            e.preventDefault();
        });

        // Desktop Mouse Wheel (Accumulated Delta + Smooth Exponential Zoom) & Drag / Right-Click Loupe
        let wheelDeltaAccum = 0;
        viewport.addEventListener('wheel', e => {
            e.preventDefault();
            const hoveredPlane = findPlaneAtPoint(e.clientX, e.clientY) || activePlane;
            if (planes[hoveredPlane].images.length === 0) return;

            const normDelta = e.deltaMode === 1 ? e.deltaY * 20 : (e.deltaMode === 2 ? e.deltaY * 100 : e.deltaY);

            if (e.ctrlKey || e.metaKey) {
                const zoomFactor = Math.exp(-normDelta * 0.002);
                zoomAtClientPoint(viewState.scale * zoomFactor, e.clientX, e.clientY, hoveredPlane);
                if (loupeState.active) updateLoupePosition(e.clientX, e.clientY);
            } else {
                stopPlay();
                wheelDeltaAccum += normDelta;
                const STEP_THRESHOLD = 45;
                if (Math.abs(wheelDeltaAccum) >= STEP_THRESHOLD) {
                    const steps = Math.trunc(wheelDeltaAccum / STEP_THRESHOLD);
                    wheelDeltaAccum -= steps * STEP_THRESHOLD;
                    stepSlice(steps, isMultiView ? hoveredPlane : null);
                    if (loupeState.active) updateLoupePosition(e.clientX, e.clientY);
                }
            }
        }, { passive: false });

        viewport.addEventListener('mousedown', e => {
            if (e.target.closest('.pane-footer') || e.target.closest('.drop-overlay')) return;

            if (e.button === 2) {
                e.preventDefault();
                activateLoupe(e.clientX, e.clientY, false);
                return;
            }

            if (e.button !== 0 && e.button !== 1) return;
            if (!hasAnyLoadedSlices()) return;
            isDragging = true;
            startX = e.clientX - viewState.panX;
            startY = e.clientY - viewState.panY;
            viewport.classList.add('dragging');
        });

        window.addEventListener('mousemove', e => {
            if (loupeState.active && !loupeState.isTouch) {
                updateLoupePosition(e.clientX, e.clientY);
            }
            if (!isDragging) return;
            viewState.panX = e.clientX - startX;
            viewState.panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', e => {
            if (e.button === 2 && loupeState.active) {
                hideLoupe();
            }
            isDragging = false;
            viewport.classList.remove('dragging');
        });

        window.addEventListener('blur', hideLoupe);

        // Mobile Touch Gestures (Focal Pinch-Zoom, Double-Tap at Point, Long-Press 3x Loupe)
        let touchMode = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartPanX = 0;
        let touchStartPanY = 0;
        let touchMoved = false;
        let lastSwipeStep = 0;
        let lastPinchDist = 0;
        let lastPinchMidX = 0;
        let lastPinchMidY = 0;
        let lastCleanTapTime = 0;
        let lastCleanTapX = 0;
        let lastCleanTapY = 0;
        let longPressTimer = null;

        function clearLongPressTimer() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        function getTouchDistance(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        viewport.addEventListener('touchstart', e => {
            if (e.target.closest('.pane-footer') || e.target.closest('.drop-overlay')) return;
            if (!hasAnyLoadedSlices()) return;

            // Auto-close mobile glossary sheet when user touches the CT viewport
            if (window.innerWidth <= 820 && !sidebar.classList.contains('collapsed')) {
                sidebar.classList.add('collapsed');
                toggleGlossaryBtn.classList.remove('active');
                searchInput.blur();
            }

            clearLongPressTimer();

            if (e.touches.length === 1) {
                touchMode = 'single';
                touchMoved = false;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartPanX = viewState.panX;
                touchStartPanY = viewState.panY;
                lastSwipeStep = 0;

                // Long-press (~320ms) activates 3x Magnifying Glass on mobile
                longPressTimer = setTimeout(() => {
                    if (touchMode === 'single' && !touchMoved) {
                        if (activateLoupe(touchStartX, touchStartY, true)) {
                            touchMode = 'loupe';
                        }
                    }
                }, 320);
            } else if (e.touches.length === 2) {
                hideLoupe();
                touchMode = 'pinch';
                touchMoved = true;
                lastPinchDist = getTouchDistance(e.touches[0], e.touches[1]);
                lastPinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                lastPinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', e => {
            if (!touchMode || !hasAnyLoadedSlices()) return;
            e.preventDefault();

            if (touchMode === 'loupe' && e.touches.length === 1) {
                updateLoupePosition(e.touches[0].clientX, e.touches[0].clientY);
                return;
            }

            if (touchMode === 'pinch' && e.touches.length === 2) {
                clearLongPressTimer();
                const dist = getTouchDistance(e.touches[0], e.touches[1]);
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

                if (lastPinchDist > 0) {
                    const scaleFactor = dist / lastPinchDist;
                    zoomAtClientPoint(viewState.scale * scaleFactor, midX, midY, activePlane);
                }

                if (viewState.scale > 1) {
                    viewState.panX += (midX - lastPinchMidX);
                    viewState.panY += (midY - lastPinchMidY);
                    updateTransform();
                }

                lastPinchDist = dist;
                lastPinchMidX = midX;
                lastPinchMidY = midY;
            } else if (touchMode === 'single' && e.touches.length === 1) {
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;

                if (Math.hypot(dx, dy) > 8) {
                    touchMoved = true;
                    clearLongPressTimer();
                }

                // Pan when zoomed in; swipe vertically to scroll slices when at 1x
                if (viewState.scale > 1.02) {
                    viewState.panX = touchStartPanX + dx;
                    viewState.panY = touchStartPanY + dy;
                    updateTransform();
                } else if (touchMoved) {
                    stopPlay();
                    const currentSwipeStep = Math.round(dy / 14);
                    const delta = currentSwipeStep - lastSwipeStep;
                    if (delta !== 0) {
                        stepSlice(delta, isMultiView ? activePlane : null);
                        lastSwipeStep = currentSwipeStep;
                    }
                }
            }
        }, { passive: false });

        viewport.addEventListener('touchend', e => {
            clearLongPressTimer();
            if (touchMode === 'loupe') {
                hideLoupe();
                touchMode = null;
                return;
            }

            // Seamless transition from 2-finger pinch to 1-finger pan
            if (touchMode === 'pinch' && e.touches.length === 1) {
                touchMode = 'single';
                touchMoved = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartPanX = viewState.panX;
                touchStartPanY = viewState.panY;
                return;
            }

            if (touchMode === 'single' && !touchMoved && e.changedTouches.length === 1) {
                const now = Date.now();
                const tapX = e.changedTouches[0].clientX;
                const tapY = e.changedTouches[0].clientY;
                const distFromLastTap = Math.hypot(tapX - lastCleanTapX, tapY - lastCleanTapY);

                if (now - lastCleanTapTime < 280 && distFromLastTap < 36) {
                    if (viewState.scale > 1.15) {
                        zoomAtClientPoint(1);
                    } else {
                        zoomAtClientPoint(2.5, tapX, tapY, activePlane);
                    }
                    lastCleanTapTime = 0;
                } else {
                    lastCleanTapTime = now;
                    lastCleanTapX = tapX;
                    lastCleanTapY = tapY;
                }
            }

            if (e.touches.length === 0) {
                touchMode = null;
            }
        });

        viewport.addEventListener('touchcancel', () => {
            clearLongPressTimer();
            hideLoupe();
            touchMode = null;
        });

        // Bottom & Toolbar Controls
        sliceSlider.addEventListener('input', e => {
            stopPlay();
            showSlice(parseInt(e.target.value, 10));
        });
        prevBtn.addEventListener('click', () => {
            stopPlay();
            stepSlice(-1);
        });
        nextBtn.addEventListener('click', () => {
            stopPlay();
            stepSlice(1);
        });

        zoomInBtn.addEventListener('click', () => {
            zoomAtClientPoint(viewState.scale * 1.25);
        });

        zoomOutBtn.addEventListener('click', () => {
            zoomAtClientPoint(viewState.scale / 1.25);
        });

        function setBrightness(val) {
            brightness = Number(val);
            brightnessRange.value = brightness;
            brightnessRangeMobile.value = brightness;
            updateFilters();
        }

        function setContrast(val) {
            contrast = Number(val);
            contrastRange.value = contrast;
            contrastRangeMobile.value = contrast;
            updateFilters();
        }

        brightnessRange.addEventListener('input', e => setBrightness(e.target.value));
        brightnessRangeMobile.addEventListener('input', e => setBrightness(e.target.value));
        contrastRange.addEventListener('input', e => setContrast(e.target.value));
        contrastRangeMobile.addEventListener('input', e => setContrast(e.target.value));

        mobileAdjustBtn.addEventListener('click', () => {
            const visible = mobileAdjustBar.classList.toggle('visible');
            mobileAdjustBtn.classList.toggle('active', visible);
        });

        invertBtn.addEventListener('click', () => {
            inverted = !inverted;
            invertBtn.classList.toggle('active', inverted);
            updateFilters();
        });

        pixelatedBtn.addEventListener('click', () => {
            isPixelated = !isPixelated;
            pixelatedBtn.classList.toggle('active', isPixelated);
            updateFilters();
        });

        resetBtn.addEventListener('click', resetView);

        window.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
                e.preventDefault();
                sidebar.classList.remove('collapsed');
                toggleGlossaryBtn.classList.add('active');
                searchInput.focus();
                searchInput.select();
                return;
            }

            if (document.activeElement === searchInput) {
                if (e.key === 'Escape') searchInput.blur();
                return;
            }

            // Do not hijack arrow keys when adjusting brightness/contrast or pane sliders
            if (
                document.activeElement &&
                document.activeElement.tagName === 'INPUT' &&
                document.activeElement.type === 'range' &&
                document.activeElement !== sliceSlider
            ) {
                return;
            }

            if (e.key === '1') { stopPlay(); switchPlane('axial'); return; }
            if (e.key === '2') { stopPlay(); switchPlane('coronal'); return; }
            if (e.key === '3') { stopPlay(); switchPlane('sagittal'); return; }
            if (e.key === '4') { setMultiView(!isMultiView); return; }

            if (e.key === ' ') {
                if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
                e.preventDefault();
                togglePlay();
                return;
            }

            const st = planes[activePlane];
            if (st.images.length === 0) return;

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                stopPlay();
                stepSlice(1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                stopPlay();
                stepSlice(-1);
            } else if (e.key === 'PageDown') {
                e.preventDefault();
                stopPlay();
                stepSlice(5);
            } else if (e.key === 'PageUp') {
                e.preventDefault();
                stopPlay();
                stepSlice(-5);
            } else if (e.key === 'Home') {
                e.preventDefault();
                stopPlay();
                showSlice(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                stopPlay();
                showSlice(st.images.length - 1);
            } else if (e.key === 'r' || e.key === 'R') {
                resetView();
            } else if (e.key === '+' || e.key === '=') {
                zoomAtClientPoint(viewState.scale * 1.2);
            } else if (e.key === '-') {
                zoomAtClientPoint(viewState.scale / 1.2);
            }
        });

        applyLanguage(currentLang);
    </script>
</body>
</html>
